<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MFC Quiz · Prototype avatar 3D</title>
<style>
body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% 25%,#13265A,#050A16);color:#F2F4F7;font-family:Inter,system-ui,-apple-system,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 30px}
h1{font-size:20px;margin:4px 0 2px}.k{font:700 11px ui-monospace,monospace;letter-spacing:1.5px;color:#D4AF37}
#stage{height:62vh;border-radius:26px;border:1px solid rgba(212,175,55,.35);overflow:hidden;margin-top:12px;position:relative;background:linear-gradient(180deg,rgba(19,38,90,.5),rgba(5,10,22,.2))}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9AA4B5;font-size:13px}
.hint{position:absolute;bottom:10px;width:100%;text-align:center;font-size:12px;color:#C9CED6;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:1px solid rgba(201,206,214,.25);background:rgba(255,255,255,.06);color:#F2F4F7;border-radius:999px;padding:9px 14px;font:600 13.5px Inter,system-ui;cursor:pointer}
button.on{background:rgba(212,175,55,.18);border-color:#D4AF37;color:#F3D98A}
.sw{width:30px;height:30px;padding:0;border-radius:50%}
.note{font-size:12px;color:#9AA4B5;line-height:1.5;margin-top:16px}
</style></head><body><div class="wrap">
<div class="k">PROTOTYPE · AVATAR 3D</div><h1>Athlète MFC — niveau <span id="lv">1</span></h1>
<div id="stage"><div id="load">Chargement de la 3D…</div><div class="hint">↔ Fais-le tourner avec le doigt</div></div>
<div class="row" id="sex"><button data-v="h" class="on">Homme</button><button data-v="f">Femme</button></div>
<div class="row" id="lvl"><button data-v="1" class="on">Niveau 1</button><button data-v="5">Niveau 5</button></div>
<div class="row" id="hair"></div>
<div class="row" id="skin"></div>
<div class="row"><button id="a1">🙌 Bonne réponse</button><button id="a2">😕 Mauvaise réponse</button><button id="a4">💪 Biceps</button><button id="a3">👋 Salut</button></div>
<div class="note">Prototype de test : il ne modifie pas ton avatar actuel. Personnages de base : Quaternius (licence CC0, domaine public), recolorés et sculptés pour MFC.</div>
</div>
<script type="module">
import './avatar3.js';
const A=window.MFCAvatar3, cfg={sex:'h',level:1,hair:'court',skin:'#D9A07A'};
const HAIRS={h:[['court','Court'],['mi','Mi-long'],['pique','Piqué'],['long','Coiffé']],f:[['queue','Long'],['court','Court'],['carre','Carré'],['long','Blond']]};
const SKINS=['#F2C9A6','#D9A07A','#B97A52','#8A5534','#5E3824'];
function chips(){ document.getElementById('hair').innerHTML=HAIRS[cfg.sex].map(h=>`<button data-v="${h[0]}" class="${cfg.hair===h[0]?'on':''}">${h[1]}</button>`).join('');
  document.getElementById('skin').innerHTML=SKINS.map(c=>`<button class="sw ${cfg.skin===c?'on':''}" data-v="${c}" style="background:${c}"></button>`).join(''); }
async function go(){ document.getElementById('lv').textContent=cfg.level; chips(); await A.update(cfg); }
function bind(id,key,cb){ document.getElementById(id).addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; cfg[key]=key==='level'?+b.dataset.v:b.dataset.v; if(cb) cb(); [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b)); go(); }); }
bind('sex','sex',()=>{ cfg.hair=HAIRS[cfg.sex][0][0]; }); bind('lvl','level'); bind('hair','hair'); bind('skin','skin');
document.getElementById('a1').onclick=()=>A.anim('good'); document.getElementById('a2').onclick=()=>A.anim('sad'); document.getElementById('a4').onclick=()=>A.anim('flex'); document.getElementById('a3').onclick=()=>A.anim('Wave');
chips(); await A.mount(document.getElementById('stage'),cfg,{onReady:()=>document.getElementById('load').remove()});
document.title='done';
</script></body></html>
