<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1128">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MFC">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>MFC Coaching</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
:root{--bg:#0A1128;--card:#121C3D;--card2:#1B2750;--gold:#D4AF6A;--silver:#C9CED6;--muted:#9AA3B5;--dim:#8F99AD;--line:rgba(201,206,214,.12);--warn:#E89A6B;--text:#F4F5F7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 120px);display:flex;flex-direction:column;gap:16px}
h1{font-family:Sora,Inter,sans-serif;font-size:26px;font-weight:600;margin:0;letter-spacing:-.3px}
h2{font-family:Sora,Inter,sans-serif;font-size:19px;font-weight:600;margin:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.gold{color:var(--gold)}.muted{color:var(--muted)}.warn{color:var(--warn)}.small{font-size:14px}.xs{font-size:12px}.b{font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.hl{border-color:rgba(212,175,106,.4)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.btn{height:52px;border-radius:14px;border:none;background:var(--gold);color:var(--bg);font-weight:600;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;border:1px solid rgba(201,206,214,.25);color:var(--text)}
.btn.sm{height:40px;font-size:13px;width:auto;padding:0 14px;border-radius:12px}
.btn.dashed{background:transparent;border:1.5px dashed rgba(201,206,214,.3);color:var(--silver);font-weight:500;font-size:14px}
.btn.danger{background:transparent;border:1px solid rgba(232,154,107,.5);color:var(--warn)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid transparent;text-align:left;width:100%;color:var(--text)}
.item.hl{border-color:var(--gold)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--silver);flex-shrink:0}
.bar{height:6px;background:rgba(201,206,214,.12);border-radius:3px;overflow:hidden}.bar>div{height:100%;background:var(--gold);border-radius:3px;transition:width .25s}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#0D1631;border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);display:grid;z-index:10}
.tabs button{background:none;border:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;min-height:48px}
.tabs button.on{color:var(--gold)}
.top{display:flex;align-items:center;gap:6px;margin:-6px 0 0 -12px}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--silver);flex-shrink:0}
.seg{display:grid;gap:4px;padding:4px;border-radius:12px;background:var(--card)}
.seg button{height:36px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-size:13px;font-weight:500}
.seg button.on{background:#1E2A55;color:var(--text);font-weight:600}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 1fr 44px;gap:8px;align-items:center;text-align:center}
.sets input{width:100%;height:42px;border-radius:10px;border:1px solid rgba(201,206,214,.18);background:var(--bg);color:var(--text);text-align:center;font-weight:600;font-size:16px;padding:0 2px}
.sets.head{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.check{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);background:transparent;margin:0 auto;display:flex;align-items:center;justify-content:center;padding:0}
.check.ok{background:var(--gold)}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;height:48px;border-radius:12px;border:1px solid rgba(201,206,214,.18);background:var(--card);color:var(--text);font-size:16px;font-weight:500;padding:0 14px}
.field textarea{height:auto;padding:12px 14px;resize:none;line-height:1.45}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mini{display:flex;flex-direction:column;gap:4px;font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.mini input{height:40px;width:100%;border-radius:10px;border:1px solid rgba(201,206,214,.18);background:var(--bg);color:var(--text);text-align:center;font-weight:600;font-size:16px;padding:0 2px}
.txt{height:40px;width:100%;border-radius:10px;border:1px solid rgba(201,206,214,.18);background:var(--bg);color:var(--text);font-size:15px;padding:0 12px}
.txt.name{font-weight:600;font-size:16px}
.sc{height:44px;border-radius:10px;border:1px solid rgba(201,206,214,.18);background:transparent;color:var(--silver);font-weight:500}
.sc.on{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid rgba(201,206,214,.22);background:transparent;color:var(--silver);font-size:13px;flex-shrink:0}
.chip.on{border-color:var(--gold);color:var(--gold);font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:12px;font-size:12px;border:1px solid transparent}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:Sora,sans-serif;font-size:19px;font-weight:600}
.kpi span{font-size:12px;color:var(--muted)}
.rest{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);max-width:456px;margin:0 auto;background:#16224A;border:1px solid rgba(212,175,106,.45);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:20;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.silver{background:linear-gradient(180deg,#F4F5F7 0%,#AEB4BF 55%,#E3E6EB 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{border-radius:50%;border:1.5px solid var(--silver);display:flex;align-items:center;justify-content:center;font-family:Sora,sans-serif;font-weight:700;letter-spacing:.5px;flex-shrink:0;background:none;padding:0}
.line{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.line:last-child{border-bottom:none}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.pvr{display:grid;grid-template-columns:1.2fr 1fr 1.4fr;gap:6px;font-size:13px;align-items:start}
.alert{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:rgba(232,154,107,.1);font-size:13px;line-height:1.4}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid rgba(212,175,106,.45);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
var KEY='mfc-coaching-v1';
var $=function(s){return document.querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,10)};
function loc(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
var TODAY=loc(new Date());
function add(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return loc(d)}
var JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function dd(s){return new Date(s+'T12:00:00')}
function dLong(s){var d=dd(s);var j=JOURS[d.getDay()];return j[0].toUpperCase()+j.slice(1)+' '+d.getDate()+' '+MOIS[d.getMonth()]}
function dShort(s){var d=dd(s);return JOURS[d.getDay()].slice(0,3)+'. '+d.getDate()+'/'+String(d.getMonth()+1).padStart(2,'0')}
function fmt(n){if(n===''||n==null||isNaN(n))return '';return String(Math.round(n*10)/10).replace('.',',')}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function e1(kg,r){return kg*(1+r/30)}
function mmss(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function restTxt(s){return s>=60?(Math.floor(s/60)+' min'+(s%60?' '+String(s%60).padStart(2,'0'):'')):s+' s'}
function initials(n){return String(n).split(/\s+/).map(function(w){return w[0]||''}).join('').slice(0,2).toUpperCase()}
function clone(o){return JSON.parse(JSON.stringify(o))}
function isTime(e){return e.unit==='min'}

var IC={home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/>',chart:'<polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/>',pulse:'<polyline points="22 12 18 12 15 20 9 4 6 12 2 12"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>',back:'<polyline points="15 18 9 12 15 6"/>',chev:'<polyline points="9 6 15 12 9 18"/>',check:'<polyline points="5 12 10 17 19 7"/>',x:'<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',info:'<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12.5"/><circle cx="12" cy="16" r=".6"/>'};
function ic(n,s,c,w){return '<svg width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="none" stroke="'+(c||'currentColor')+'" stroke-width="'+(w||1.8)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'}

/* ---------- Données de démonstration ---------- */
var LIB=['Squat arrière','Squat avant','Soulevé de terre','Soulevé de terre roumain','Développé couché','Développé incliné haltères','Développé militaire','Traction','Traction lestée','Dips lestés','Rowing barre','Rowing haltère','Hip thrust','Fentes bulgares','Presse à cuisses','Leg curl','Mollets debout','Gainage','Footing zone 2','Fractionné','Sortie trail','Vélo'];
function exB(kg){return [
 {name:'Squat arrière',sets:4,reps:5,kg:kg,rpe:8,rest:180,cue:'Descente contrôlée en 3 s, pause d’1 s en bas, remontée explosive.'},
 {name:'Soulevé de terre roumain',sets:3,reps:8,kg:kg-30,rpe:7,rest:120,cue:'Dos neutre, hanches vers l’arrière.'},
 {name:'Fentes bulgares',sets:3,reps:10,kg:20,rpe:8,rest:90,cue:'10 répétitions par jambe.'}]}
function fakeLog(ex){return ex.map(function(e){var a=[];for(var i=0;i<e.sets;i++)a.push({kg:e.kg,reps:e.reps,rpe:Math.min(10,e.rpe-0.5+i*0.5),ok:true});return a})}
function seed(){
 var s=[];
 [107.5,110,112.5,115,117.5].forEach(function(kg,i){var ex=exB(kg);s.push({id:uid(),clientId:'c1',date:add(TODAY,-35+i*7),name:'Séance B — Bas du corps',exercises:ex,done:true,log:fakeLog(ex)})});
 s.push({id:uid(),clientId:'c1',date:TODAY,name:'Séance B — Bas du corps',exercises:exB(120),done:false,log:[]});
 s.push({id:uid(),clientId:'c1',date:add(TODAY,1),name:'Footing zone 2',exercises:[{name:'Footing zone 2',sets:1,reps:45,kg:0,rpe:4,rest:0,cue:'45 minutes en aisance respiratoire (tu peux parler).',unit:'min'}],done:false,log:[]});
 s.push({id:uid(),clientId:'c1',date:add(TODAY,3),name:'Séance C — Full body',exercises:[{name:'Développé couché',sets:4,reps:5,kg:90,rpe:8,rest:180,cue:''},{name:'Traction lestée',sets:4,reps:4,kg:20,rpe:8,rest:150,cue:''},{name:'Hip thrust',sets:3,reps:10,kg:100,rpe:7,rest:90,cue:''}],done:false,log:[]});
 var exJ=[{name:'Presse à cuisses',sets:4,reps:12,kg:140,rpe:8,rest:90,cue:''},{name:'Rowing haltère',sets:3,reps:12,kg:16,rpe:8,rest:75,cue:''}];
 s.push({id:uid(),clientId:'c2',date:add(TODAY,-2),name:'Séance A — Full body',exercises:exJ,done:false,log:[]});
 s.push({id:uid(),clientId:'c2',date:add(TODAY,1),name:'Séance B — Full body',exercises:clone(exJ),done:false,log:[]});
 return {v:1,role:null,clientId:null,
  clients:[
   {id:'c1',name:'Thomas R.',goal:'Force + préparation trail',phase:'Méso 2 · Force — semaine 3/4',coachNote:'Garde 2 répétitions en réserve sur le squat cette semaine. On pousse la semaine prochaine.',notes:'Ancienne entorse cheville droite (2023). Trail de 30 km visé en mars.'},
   {id:'c2',name:'Julie D.',goal:'Recomposition corporelle',phase:'Méso 1 · Hypertrophie — semaine 4/6',coachNote:'Super régularité, continue comme ça.',notes:''}],
  sessions:s,
  checkins:[{id:uid(),clientId:'c1',date:add(TODAY,-1),sommeil:4,energie:3,fatigue:2,motivation:5,poids:'78,4',douleur:'Aucune',note:'Grosse semaine au boulot, un peu à plat jeudi. Le squat est passé mais la dernière série était dure.',seen:false}]};
}
var D;
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
D=load();
var U={view:'home',p:{},rest:null,ci:{},sel:null,edit:null,nc:null};

/* ---------- Aides ---------- */
function client(id){return D.clients.find(function(c){return c.id===(id||D.clientId)})}
function sessFor(cid){return D.sessions.filter(function(s){return s.clientId===cid}).sort(function(a,b){return a.date.localeCompare(b.date)})}
function status(s){if(s.done)return ['Fait','var(--silver)'];if(s.date===TODAY)return ['Aujourd’hui','var(--gold)'];if(s.date<TODAY)return ['Manquée','var(--warn)'];return ['À venir','var(--muted)']}
function hasPlan(e){return Array.isArray(e.plan)&&e.plan.length===e.sets}
function target(e){if(isTime(e))return e.reps+' min'+(e.rpe?' · RPE '+fmt(e.rpe):'');if(hasPlan(e))return 'Essais : '+e.plan.map(function(p){return fmt(p[0])+' kg'}).join(' / ')+(e.rest?' · repos '+restTxt(e.rest):'');return e.sets+' × '+e.reps+(e.unit==='sec'?' s':'')+(e.kg?' · '+fmt(e.kg)+' kg':'')+(e.rpe?' · RPE '+fmt(e.rpe):'')+(e.rest?' · repos '+restTxt(e.rest):'')}
function shortT(e){if(isTime(e))return e.reps+' min';if(hasPlan(e))return e.sets+'×'+e.reps+' · '+e.plan.map(function(p){return fmt(p[0])}).join('/');return e.sets+'×'+e.reps+(e.unit==='sec'?' s':'')+(e.kg?' · '+fmt(e.kg):'')+(e.rpe?' · @'+fmt(e.rpe):'')}
function bestSet(arr){var ok=(arr||[]).filter(function(x){return x.ok&&x.kg>0});if(!ok.length)return null;return ok.reduce(function(a,x){return e1(x.kg,x.reps)>e1(a.kg,a.reps)?x:a})}
function lastPerf(cid,name,before){var ss=sessFor(cid).filter(function(s){return s.done&&s.date<before}).reverse();for(var j=0;j<ss.length;j++){var s=ss[j];var i=s.exercises.findIndex(function(e){return e.name===name});if(i>-1){var b=bestSet(s.log[i]);if(b)return fmt(b.kg)+' kg × '+b.reps+(b.rpe!==''&&b.rpe!=null?' · RPE '+fmt(b.rpe):'')}}return ''}
function adherence(cid){var past=sessFor(cid).filter(function(s){return s.date<=TODAY&&s.date>=add(TODAY,-28)});var due=past.filter(function(s){return s.date<TODAY||s.done});if(!due.length)return null;return Math.round(due.filter(function(s){return s.done}).length/due.length*100)}
function lastCi(cid){var a=D.checkins.filter(function(c){return c.clientId===cid}).sort(function(a,b){return a.date.localeCompare(b.date)});return a[a.length-1]}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on')},2400)}
function logo(h){return '<img src="logo-mark.png" alt="MFC" style="height:'+h+'px;width:auto;display:block">'}
function tabs(items){return '<nav class="tabs" aria-label="Navigation" style="grid-template-columns:repeat('+items.length+',1fr)">'+items.map(function(t){var on=U.view===t[0];return '<button data-a="go" data-v="'+t[0]+'" class="'+(on?'on':'')+'"'+(on?' aria-current="page"':'')+'>'+ic(t[2])+t[1]+'</button>'}).join('')+'</nav>'}
function top(title,backView,backId,right){return '<div class="top"><button class="icon-btn" data-a="go" data-v="'+backView+'"'+(backId?' data-id="'+backId+'"':'')+' aria-label="Retour">'+ic('back',22,'currentColor',2)+'</button><span style="flex:1;font-family:Sora,sans-serif;font-size:17px;font-weight:600">'+title+'</span>'+(right||'')+'</div>'}

/* ---------- Écran d’entrée ---------- */
function vRole(){
 var h='<div class="wrap" style="justify-content:center;align-items:stretch;padding-bottom:48px">';
 h+='<div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;margin-bottom:12px">'+'<img src="logo-full.png" alt="MFC – Mathis Félicité Coaching" style="width:min(280px,75vw);height:auto;display:block"><span class="small muted" style="margin-top:6px">Construire un corps capable de tout faire</span></div>';
 if(U.p.pick){
  h+='<span class="eyebrow">Choisis ton profil</span>';
  if(!D.clients.length)h+='<div class="empty">Aucun profil client pour l’instant. Crée-le d’abord dans l’espace coach avec « + Nouveau client ».</div>';
  D.clients.forEach(function(c){h+='<button class="item" data-a="asClient" data-id="'+c.id+'"><span class="av">'+esc(initials(c.name))+'</span><span class="col"><span class="b small">'+esc(c.name)+'</span><span class="xs muted">'+esc(c.goal)+'</span></span>'+ic('chev',18,'#9AA3B5',2)+'</button>'});
  h+='<button class="btn ghost" data-a="go" data-v="role">Retour</button>';
 }else{
  h+='<button class="btn" data-a="asCoach">Espace coach</button><button class="btn ghost" data-a="pick">Espace client</button>';
 }
 h+='<p class="xs muted" style="text-align:center;line-height:1.5;margin:8px 0 0">Version de démonstration : les données restent sur cet appareil.</p></div>';
 return h;
}

/* ---------- Espace client ---------- */
var CTABS=[['home','Accueil','home'],['prog','Programme','cal'],['progress','Progrès','chart'],['checkin','Check-in','pulse']];
function vHome(){
 var c=client();var ss=sessFor(c.id);
 var next=ss.find(function(s){return !s.done&&s.date>=TODAY});

 h+='<span class="eyebrow">À venir</span>'+(up.length?up.map(card).join(''):'<div class="empty">Aucune séance à venir.</div>');
 if(past.length)h+='<span class="eyebrow">Récent</span>'+past.map(card).join('');
 h+='<span class="eyebrow" style="margin-top:6px">Suivi</span><label class="field">Phase affichée au client<input data-in="client" data-f="phase" value="'+esc(c.phase||'')+'"></label><label class="field">Objectif<input data-in="client" data-f="goal" value="'+esc(c.goal||'')+'"></label><label class="field">Note visible par le client<textarea rows="3" data-in="client" data-f="coachNote">'+esc(c.coachNote||'')+'</textarea></label><label class="field">Notes privées (blessures, contexte)<textarea rows="3" data-in="client" data-f="notes">'+esc(c.notes||'')+'</textarea></label><span class="xs muted">Enregistré automatiquement.</span>';
 return h+'</div>';
}
function vEdit(){
 var E=U.edit;if(!E){U.view='clients';return vClients()}
 var c=client(E.clientId);
 var h='<div class="wrap">'+top(E.id?'Modifier la séance':'Nouvelle séance','fiche',E.clientId,'');
 h+='<span class="xs muted" style="margin-top:-8px">Pour '+esc(c?c.name:'')+'</span>';
 h+='<label class="field">Nom de la séance<input data-in="ed" data-f="name" value="'+esc(E.name)+'" placeholder="ex. Séance A — Haut du corps"></label><label class="field">Date<input type="date" data-in="ed" data-f="date" value="'+esc(E.date)+'"></label>';
 E.exercises.forEach(function(e,i){
  var t=isTime(e);
  h+='<section class="card" style="padding:14px;gap:10px"><div class="row" style="gap:6px"><span class="xs muted b" style="width:16px">'+(i+1)+'</span><input class="txt name" data-in="ex" data-i="'+i+'" data-f="name" value="'+esc(e.name)+'" aria-label="Nom de l’exercice '+(i+1)+'"><button class="icon-btn" style="width:36px;height:36px" data-a="exUp" data-i="'+i+'" aria-label="Monter l’exercice"'+(i===0?' disabled style="opacity:.3"':'')+'><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 15 12 9 18 15"/></svg></button><button class="icon-btn" style="width:36px;height:36px;color:var(--warn)" data-a="exDel" data-i="'+i+'" aria-label="Supprimer l’exercice">'+ic('x',18,'currentColor',2)+'</button></div>';
  if(t){h+='<div class="grid5"><label class="mini" style="grid-column:span 2">Durée (min)<input inputmode="numeric" data-in="ex" data-i="'+i+'" data-f="reps" value="'+fmt(e.reps)+'"></label><label class="mini">RPE<input inputmode="decimal" data-in="ex" data-i="'+i+'" data-f="rpe" value="'+fmt(e.rpe)+'"></label></div>'}
  else{h+='<div class="grid5"><label class="mini">Séries<input inputmode="numeric" data-in="ex" data-i="'+i+'" data-f="sets" value="'+fmt(e.sets)+'"></label><label class="mini">'+(e.unit==='sec'?'Sec':'Reps')+'<input inputmode="numeric" data-in="ex" data-i="'+i+'" data-f="reps" value="'+fmt(e.reps)+'"></label><label class="mini">Kg<input inputmode="decimal" data-in="ex" data-i="'+i+'" data-f="kg" value="'+(e.kg?fmt(e.kg):'')+'" placeholder="—"></label><label class="mini">RPE<input inputmode="decimal" data-in="ex" data-i="'+i+'" data-f="rpe" value="'+(e.rpe?fmt(e.rpe):'')+'" placeholder="—"></label><label class="mini">Repos s<input inputmode="numeric" data-in="ex" data-i="'+i+'" data-f="rest" value="'+fmt(e.rest)+'"></label></div>'}
  h+='<input class="txt" data-in="ex" data-i="'+i+'" data-f="cue" value="'+esc(e.cue||'')+'" placeholder="Consigne (facultatif)" aria-label="Consigne"></section>';
 });
 h+='<div class="card" style="padding:14px"><span class="small b">Ajouter un exercice</span><input class="txt" id="newEx" list="lib" placeholder="Rechercher ou taper un nom" aria-label="Nom du nouvel exercice"><datalist id="lib">'+LIB.map(function(n){return '<option value="'+esc(n)+'">'}).join('')+'</datalist><button class="btn dashed" data-a="exAdd">+ Ajouter</button></div>';
 h+='<button class="btn" data-a="saveEdit">Enregistrer et envoyer au client</button>';
 if(E.id){h+=U.p.confirmDel?'<button class="btn danger" data-a="delSess">Confirmer la suppression</button>':'<button class="btn ghost" data-a="askDel">Supprimer la séance</button>'}
 return h+'</div>';
}
function vAgenda(){
 var h='<div class="wrap"><h1>Agenda</h1><span class="small muted" style="margin-top:-8px">Les 14 prochains jours, tous clients confondus</span>';
 var any=false;
 for(var i=0;i<14;i++){var dt=add(TODAY,i);var ss=D.sessions.filter(function(s){return s.date===dt});if(!ss.length)continue;any=true;
  h+='<span class="eyebrow" style="margin-top:6px'+(i===0?';color:var(--gold)':'')+'">'+(i===0?'Aujourd’hui · ':'')+dLong(dt)+'</span>';
  ss.forEach(function(s){var c=client(s.clientId);var st=status(s);h+='<button class="item" data-a="edit" data-id="'+s.id+'"><span class="av" style="width:32px;height:32px;font-size:11px">'+esc(initials(c?c.name:'?'))+'</span><span class="col"><span class="small b">'+esc(s.name)+'</span><span class="xs muted">'+esc(c?c.name:'')+'</span></span><span class="xs" style="color:'+st[1]+'">'+st[0]+'</span></button>'})}
 if(!any)h+='<div class="empty">Aucune séance programmée sur les 14 prochains jours.</div>';
 return h+'</div>'+tabs(KTABS);
}
function vSettings(){
 var h='<div class="wrap"><h1>Réglages</h1><section class="card"><span class="small b">Espace actuel : '+(D.role==='coach'?'coach':'client ('+esc(client()?client().name:'')+')')+'</span><span class="xs muted" style="line-height:1.5">Version de démonstration : les données sont enregistrées sur cet appareil uniquement. La synchronisation coach ↔ clients arrive dans la prochaine étape.</span></section>';
 h+='<button class="btn ghost" data-a="switch">Changer d’espace</button>';
 h+=U.p.confirmEmpty?'<button class="btn danger" data-a="empty">Confirmer : tout effacer et repartir de zéro</button>':'<button class="btn ghost" data-a="askEmpty">Démarrer à vide (supprimer les exemples)</button>';
 h+=U.p.confirmReset?'<button class="btn danger" data-a="reset">Confirmer : effacer et remettre les exemples</button>':'<button class="btn ghost" data-a="askReset">Recharger les exemples</button>';
 if(D.role==='client')h+='</div>'+tabs(CTABS);else h+='</div>'+tabs(KTABS);
 return h;
}

/* ---------- Import ---------- */
function decodeImport(t){t=t.trim();if(/^MFC1:/i.test(t)){var b=t.slice(5).replace(/\s+/g,'');var bin=atob(b);var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);t=new TextDecoder().decode(bytes)}return JSON.parse(t)}
function nv(v){return v===''||v==null||isNaN(+v)?'':+v}
function importInto(cid,obj){
 var list=Array.isArray(obj)?obj:(obj&&obj.sessions?obj.sessions:[obj]);var n=0;
 list.forEach(function(s){
  if(!s||!Array.isArray(s.exercises)||!s.exercises.length)return;
  var done=!!s.done;var ex=[];var log=[];
  s.exercises.forEach(function(e,i){
   var t=e.unit==='min';
   var x={name:String(e.name||'Exercice'),sets:t?1:(+e.sets||1),reps:+e.reps||0,kg:+e.kg||0,rpe:+e.rpe||0,rest:+e.rest||0,cue:String(e.cue||'')};if(t)x.unit='min';if(e.unit==='sec')x.unit='sec';if(Array.isArray(e.plan)&&e.plan.length===x.sets)x.plan=e.plan.map(function(p){return [+p[0]||0,+p[1]||0]});
   var L=null;
   if(Array.isArray(e.log)&&e.log.length){L=e.log.map(function(r){return Array.isArray(r)?{kg:+r[0]||0,reps:+r[1]||0,rpe:nv(r[2]),ok:true}:{kg:+r.kg||0,reps:+r.reps||0,rpe:nv(r.rpe),ok:true}});if(!t)x.sets=L.length}
   else if(done){L=[];for(var k=0;k<x.sets;k++)L.push({kg:x.kg,reps:x.reps,rpe:x.rpe||'',ok:true})}
   ex.push(x);log[i]=L||undefined});
  if(!done)log=[];
  D.sessions.push({id:uid(),clientId:cid,date:/^\d{4}-\d{2}-\d{2}$/.test(s.date||'')?s.date:TODAY,name:String(s.name||'Séance importée'),exercises:ex,done:done,log:log});n++});
 return n}

/* ---------- Minuteur de repos ---------- */
var RT=null;
function startRest(sec){U.rest={end:Date.now()+sec*1000,total:sec};clearInterval(RT);RT=setInterval(tickRest,250)}
function left(){return U.rest?Math.max(0,Math.ceil((U.rest.end-Date.now())/1000)):0}
function tickRest(){if(!U.rest){clearInterval(RT);return}var l=left();var t=$('#restT'),b=$('#restB');if(t)t.textContent=mmss(l);if(b)b.style.width=(100-l/U.rest.total*100)+'%';if(l<=0){U.rest=null;clearInterval(RT);try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}toast('Repos terminé — série suivante');render(true)}}
function restBar(){if(!U.rest)return '';var l=left();return '<div class="rest" role="timer" aria-label="Minuteur de repos"><div style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0"><div class="between"><span class="small muted">Repos</span><span id="restT" style="font-family:Sora,sans-serif;font-size:22px;font-weight:600">'+mmss(l)+'</span></div><div class="bar" style="height:4px"><div id="restB" style="width:'+(100-l/U.rest.total*100)+'%;background:var(--silver)"></div></div></div><button class="btn ghost sm" data-a="addRest">+30 s</button><button class="btn sm" data-a="skipRest">Passer</button></div>'}

/* ---------- Rendu ---------- */
function render(keepScroll){
 var y=window.scrollY;var h;
 if(D.role==='client'&&!client()){D.role=null;save()}
 if(!D.role)h=vRole();
 else if(D.role==='client'){h=({home:vHome,prog:vProg,run:vRun,progress:vProgress,checkin:vCheckin,settings:vSettings}[U.view]||vHome)()}
 else{h=({clients:vClients,fiche:vFiche,edit:vEdit,run:vRun,agenda:vAgenda,settings:vSettings}[U.view]||vClients)()}
 $('#app').innerHTML=h;
 if(keepScroll)window.scrollTo(0,y);
}
function go(v,p){U.view=v;U.p=p||{};render();window.scrollTo(0,0)}
function curSess(){return D.sessions.find(function(x){return x.id===U.p.id})}

var A={
 go:function(d){if(d.v==='role'){U.p={};render();return}if(d.v==='fiche')return go('fiche',{id:d.id||(U.edit&&U.edit.clientId)});if(d.v!=='run'&&U.view==='run'){U.rest=null;clearInterval(RT)}go(d.v)},
 pick:function(){U.p={pick:true};render()},
 asCoach:function(){D.role='coach';save();go('clients')},
 asClient:function(d){D.role='client';D.clientId=d.id;save();go('home')},
 switch:function(){D.role=null;U.rest=null;save();U.p={};render();window.scrollTo(0,0)},
 run:function(d){go('run',{id:d.id,from:U.view})},
 tick:function(d){var s=curSess();var x=s.log[+d.e][+d.k];x.ok=!x.ok;if(x.ok){var e=s.exercises[+d.e];if(e.rest&&!isTime(e))startRest(e.rest);else if(isTime(e)){}}save();render(true)},
 finish:function(){var s=curSess();s.done=true;s.doneAt=new Date().toISOString();U.rest=null;clearInterval(RT);save();toast('Séance enregistrée. Bravo !');go('home')},
 skipRest:function(){U.rest=null;clearInterval(RT);render(true)},
 addRest:function(){if(U.rest){U.rest.end+=30000;U.rest.total+=30;render(true)}},
 sel:function(d){U.sel=d.v;render(true)},
 ci:function(d){U.ci[d.k]=+d.v;render(true)},
 pain:function(d){U.ci.douleur=d.v;render(true)},
 sendCi:function(){var c=U.ci;for(var i=0;i<SCALES.length;i++){if(!c[SCALES[i][0]]){toast('Note les 4 critères avant d’envoyer');return}}D.checkins.push({id:uid(),clientId:D.clientId,date:TODAY,sommeil:c.sommeil,energie:c.energie,fatigue:c.fatigue,motivation:c.motivation,poids:(c.poids||'').trim(),douleur:c.douleur||'Aucune',note:(c.note||'').trim(),seen:false});U.ci={};save();toast('Check-in envoyé à ton coach');render()},
 fiche:function(d){go('fiche',{id:d.id})},
 open:function(d){U.p.open=U.p.open===d.id?null:d.id;render(true)},
 newClient:function(){U.nc={};render(true)},
 cancelClient:function(){U.nc=null;render(true)},
 saveClient:function(){var n=(U.nc.name||'').trim();if(!n){toast('Indique au moins un nom');return}D.clients.push({id:uid(),name:n,goal:(U.nc.goal||'').trim(),phase:(U.nc.phase||'').trim(),coachNote:'',notes:''});U.nc=null;save();toast('Client ajouté');render(true)},
 newSess:function(d){U.edit={id:null,clientId:d.id,name:'',date:add(TODAY,1),exercises:[]};go('edit')},
 edit:function(d){var s=D.sessions.find(function(x){return x.id===d.id});U.edit=clone(s);go('edit')},
 exAdd:function(){var el=$('#newEx');var n=(el&&el.value||'').trim();if(!n){toast('Tape ou choisis un exercice');return}var t=/footing|fractionn|trail|vélo|velo|course|natation|marche/i.test(n);U.edit.exercises.push(t?{name:n,sets:1,reps:45,kg:0,rpe:5,rest:0,cue:'',unit:'min'}:{name:n,sets:3,reps:8,kg:0,rpe:8,rest:120,cue:''});render(true)},
 exDel:function(d){U.edit.exercises.splice(+d.i,1);render(true)},
 exUp:function(d){var i=+d.i;if(i<1)return;var a=U.edit.exercises;var t=a[i-1];a[i-1]=a[i];a[i]=t;render(true)},
 saveEdit:function(){var E=U.edit;if(!E.name.trim()){toast('Donne un nom à la séance');return}if(!E.date){toast('Choisis une date');return}if(!E.exercises.length){toast('Ajoute au moins un exercice');return}
  if(E.id){var i=D.sessions.findIndex(function(x){return x.id===E.id});var old=D.sessions[i];E.log=(old.log||[]).slice(0,E.exercises.length);D.sessions[i]=E}else{E.id=uid();E.done=false;E.log=[];D.sessions.push(E)}
  var cid=E.clientId;U.edit=null;save();toast('Séance enregistrée et visible par le client');go('fiche',{id:cid})},
 askDel:function(){U.p.confirmDel=true;render(true)},
 delSess:function(){var E=U.edit;D.sessions=D.sessions.filter(function(x){return x.id!==E.id});var cid=E.clientId;U.edit=null;save();toast('Séance supprimée');go('fiche',{id:cid})},
 nextWeek:function(d){var s=D.sessions.find(function(x){return x.id===d.id});var n=clone(s);n.id=uid();n.date=add(s.date,7);n.done=false;n.log=[];delete n.doneAt;n.exercises.forEach(function(e){if(!isTime(e)&&e.kg>0)e.kg=Math.round((e.kg+2.5)*10)/10});D.sessions.push(n);save();toast('Programmée le '+dLong(n.date));render(true)},
 askReset:function(){U.p.confirmReset=true;render(true)},
 impOpen:function(){U.p.imp=true;render(true)},
 impClose:function(){U.p.imp=false;render(true)},
 impDo:function(d){var el=$('#impTxt');var t=(el&&el.value||'').trim();if(!t){toast('Colle d’abord le code');return}
  function fin(n){if(!n){toast('Aucune séance trouvée dans ce code');return}U.p.imp=false;save();toast(n+' séance'+(n>1?'s importées':' importée'));render(true)}
  var m=t.match(/^MFC1:@([a-z0-9-]+)$/i);
  if(m){toast('Chargement…');fetch('prog/'+m[1].toLowerCase()+'.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(o){fin(importInto(d.id,o))}).catch(function(){toast('Code introuvable : vérifie ta connexion et le code')});return}
  var n=0;try{n=importInto(d.id,decodeImport(t))}catch(e){toast('Code illisible : vérifie qu’il est copié en entier');return}
  fin(n)},
 askEmpty:function(){U.p.confirmEmpty=true;render(true)},
 empty:function(){D={v:1,role:'coach',clientId:null,clients:[],sessions:[],checkins:[]};U={view:'clients',p:{},rest:null,ci:{},sel:null,edit:null,nc:{}};clearInterval(RT);save();toast('Appli vide : ajoute ton premier client');render();window.scrollTo(0,0)},
 reset:function(){var r=D.role,cid=D.clientId;D=seed();D.role=r;D.clientId=cid&&D.clients.some(function(c){return c.id===cid})?cid:'c1';U={view:r==='coach'?'clients':'home',p:{},rest:null,ci:{},sel:null,edit:null,nc:null};save();toast('Démo réinitialisée');render()}
};
var IN={
 log:function(d,v){var s=curSess();var x=s.log[+d.e][+d.k];if(d.f==='rpe')x.rpe=String(v).trim()===''?'':num(v);else x[d.f]=num(v);save()},
 ci:function(d,v){U.ci[d.f]=v},
 client:function(d,v){var c=client(U.p.id);if(c){c[d.f]=v;save()}},
 ed:function(d,v){U.edit[d.f]=v},
 ex:function(d,v){var e=U.edit.exercises[+d.i];if(d.f==='name'||d.f==='cue')e[d.f]=v;else{e[d.f]=num(v);if(d.f==='sets'||d.f==='kg'||d.f==='reps')delete e.plan}},
 note:function(d,v){var s=curSess();if(!s)return;if(!s.notes)s.notes=[];s.notes[+d.e]=v;save()},
 nc:function(d,v){U.nc[d.f]=v}
};
document.addEventListener('click',function(ev){var t=ev.target.closest('[data-a]');if(!t||t.disabled)return;var f=A[t.dataset.a];if(f){ev.preventDefault();f(t.dataset,t)}});
document.addEventListener('input',function(ev){var t=ev.target.closest('[data-in]');if(!t)return;var f=IN[t.dataset.in];if(f)f(t.dataset,t.value,t)});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target&&ev.target.id==='newEx'){ev.preventDefault();A.exAdd()}});
U.view=D.role==='coach'?'clients':'home';
render();
})();
