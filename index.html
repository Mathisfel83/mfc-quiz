<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MFC Quiz</title>
<meta name="description" content="La science du sport en 2 minutes par jour. Questions sourcées.">
<meta name="theme-color" content="#050A16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MFC Quiz">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#050A16; --bg2:#070D1C; --ink:#F2F4F7; --ink2:#DDE2EA; --muted:#9AA4B5; --silver:#C9CED6;
  --gold:#D4AF37; --gold2:#F3D98A; --goldd:#B8932A; --good:#6EC896; --bad:#F08C5A;
  --glass:rgba(255,255,255,0.045); --line:rgba(201,206,214,0.14);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --head:'Unbounded',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none}
body{overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:var(--gold2);text-decoration:none}
.app{position:fixed;inset:0;overflow:hidden;background-color:var(--bg2);
  background-image:linear-gradient(rgba(201,206,214,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(201,206,214,.045) 1px,transparent 1px);background-size:32px 32px}
.orb{position:absolute;border-radius:50%;filter:blur(24px);pointer-events:none}
.orb.a{top:-120px;right:-110px;width:330px;height:330px;background:radial-gradient(circle,rgba(212,175,55,.32),transparent 65%);animation:drift 13s ease-in-out infinite}
.orb.b{bottom:80px;left:-150px;width:350px;height:350px;background:radial-gradient(circle,rgba(60,110,255,.28),transparent 65%);animation:drift 17s ease-in-out infinite reverse}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 18px) 20px calc(var(--sab) + 110px)}
.screen.noNav{padding-bottom:calc(var(--sab) + 24px)}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:1.5px}
.h1{font-family:var(--head);font-weight:600;font-size:22px;line-height:1.25;margin:0}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.goldcard{background:linear-gradient(140deg,rgba(212,175,55,.2),rgba(212,175,55,.03) 65%);border:1px solid rgba(212,175,55,.5);border-radius:24px;box-shadow:0 10px 40px rgba(212,175,55,.12)}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:18px;font-weight:700;font-size:16px;overflow:hidden}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--goldd));color:#070D1C;box-shadow:0 10px 30px rgba(212,175,55,.35)}
.btn.gold::after{content:"";position:absolute;top:0;left:0;width:60px;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shimmer 2.8s ease-in-out infinite}
.btn.ghost{background:rgba(255,255,255,.04);border:1px solid rgba(201,206,214,.2);color:var(--silver);height:50px;font-weight:600;font-size:15px}
.btn:active{transform:scale(.98)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-family:var(--mono);font-size:13px;font-weight:700}
.bar{height:8px;border-radius:999px;background:rgba(201,206,214,.14);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--goldd),var(--gold),var(--gold2));box-shadow:0 0 12px rgba(212,175,55,.6);transform-origin:left;animation:grow 1.2s .2s cubic-bezier(.2,.8,.2,1) both}
.up{animation:up .55s ease both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}.d5{animation-delay:.3s}.d6{animation-delay:.36s}.d7{animation-delay:.42s}
/* nav */
.nav{position:absolute;left:16px;right:16px;bottom:calc(var(--sab) + 14px);padding:8px;border-radius:24px;background:rgba(14,22,42,.82);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:16px;font-size:11px;color:var(--muted)}
.nav button.on{background:rgba(212,175,55,.14);color:var(--gold);font-weight:600}
.nav svg{width:22px;height:22px}
.badge{position:absolute;margin-left:18px;margin-top:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#070D1C;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* modules */
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mod{text-align:left;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.mod .ic{width:40px;height:40px;border-radius:13px;background:rgba(212,175,55,.14);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.mod .ic svg{width:22px;height:22px}
.mod b{font-size:15px}
.mod small{font-size:12px;color:var(--muted);line-height:1.35}
.mod .bar{height:6px;margin-top:auto}
/* quiz */
.top{display:flex;align-items:center;gap:12px}
.iconbtn{width:44px;height:44px;flex-shrink:0;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--silver)}
.segs{flex:1;display:grid;gap:6px}
.seg{height:6px;border-radius:999px;background:rgba(201,206,214,.14)}
.seg.done{background:var(--gold);box-shadow:0 0 8px rgba(212,175,55,.6)}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:13px 16px;border-radius:18px;background:var(--glass);border:1px solid rgba(201,206,214,.16);font-size:15.5px;text-align:left;line-height:1.35;margin-bottom:10px}
.opt .l{width:34px;height:34px;flex-shrink:0;border-radius:11px;border:1px solid rgba(201,206,214,.3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--silver)}
.opt.good{background:rgba(110,200,150,.12);border-color:var(--good);box-shadow:0 0 28px rgba(110,200,150,.3);animation:pop .5s ease both}
.opt.good .l{background:var(--good);border-color:var(--good);color:#070D1C}
.opt.bad{background:rgba(240,140,90,.12);border-color:var(--bad);animation:shake .4s ease both}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:#070D1C}
.opt.dim{opacity:.5}
.fb{padding:15px 16px;margin-top:4px}
.fb .src{display:block;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.45}
.fb .src a{display:inline-flex;align-items:center;gap:4px;font-weight:600;margin-top:4px}
.xp{padding:4px 10px;border-radius:999px;background:rgba(212,175,55,.18);font-family:var(--mono);font-size:12px;font-weight:700;color:var(--gold);animation:float .8s .15s ease both}
/* splash */
.splash{position:absolute;inset:0;z-index:20;background:#050A16;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .6s ease}
.splash.out{opacity:0;pointer-events:none}
.aurora{position:absolute;left:50%;top:42%;width:720px;height:720px;margin:-360px 0 0 -360px;border-radius:50%;background:conic-gradient(from 0deg,rgba(212,175,55,.28),rgba(40,80,200,.3),rgba(201,206,214,.15),rgba(212,175,55,.28));filter:blur(70px);animation:spin 14s linear infinite}
.rays{position:absolute;left:50%;top:42%;width:580px;height:580px;margin:-290px 0 0 -290px;background:repeating-conic-gradient(from 0deg,rgba(243,217,138,.13) 0deg 2deg,transparent 2deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%);animation:spin 50s linear infinite,fadein 2s 1s ease both}
.floor{position:absolute;left:-100px;right:-100px;bottom:-40px;height:360px;background-image:linear-gradient(rgba(212,175,55,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.35) 1px,transparent 1px);background-size:48px 48px;transform:perspective(300px) rotateX(62deg);transform-origin:bottom;animation:floor 1.6s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%)}
.ripple{position:absolute;left:50%;top:42%;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;border:1px solid rgba(212,175,55,.6);animation:ripple 3.2s ease-out infinite}
.flash{position:absolute;left:50%;top:42%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;background:radial-gradient(circle,rgba(255,250,230,.9),rgba(243,217,138,.35) 30%,transparent 65%);animation:flash 1.4s 1.1s ease-out both}
.logo{position:relative;width:300px;height:126px;margin-top:-6vh;animation:reveal 1.6s .2s cubic-bezier(.2,.8,.2,1) both}
.logo img{position:absolute;inset:0;width:300px;height:126px}
.logo .base{filter:drop-shadow(0 8px 16px rgba(0,0,0,.65))}
.logo .w{opacity:.3;animation:bandW 3.6s 1.6s ease-in-out infinite both}
.logo .n{opacity:.9;animation:bandN 3.6s 1.6s ease-in-out infinite both}
.tag{position:relative;margin-top:28px;font-family:var(--mono);font-size:12px;color:var(--silver);animation:track 1.4s 1.2s cubic-bezier(.2,.8,.2,1) both}
.sub{position:relative;margin:14px 32px 0;text-align:center;font-family:var(--head);font-size:21px;font-weight:600;line-height:1.3;animation:up .8s 1.6s ease both}
/* result ring */
.ring{position:relative;width:150px;height:150px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring circle.v{animation:ringIn 1.4s .3s cubic-bezier(.2,.8,.2,1) both}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.confetti i{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
.sheet{position:absolute;inset:0;z-index:30;background:rgba(3,6,14,.7);display:flex;align-items:flex-end;animation:fadein .25s ease both}
.sheet>div{width:100%;max-height:85%;overflow-y:auto;padding:22px 20px calc(var(--sab) + 24px);border-radius:28px 28px 0 0;background:#0B1428;border-top:1px solid var(--line);animation:up .35s ease both}
.row{display:flex;align-items:center;gap:12px}
.list>*{padding:12px 0;border-bottom:1px solid rgba(201,206,214,.08)}
.list>*:last-child{border-bottom:0}
.wrap{max-width:520px;margin:0 auto}
.nav.n5{grid-template-columns:repeat(5,1fr)}
.nav.n5 button{font-size:10px}
.toast{position:absolute;left:16px;right:16px;top:calc(var(--sat) + 12px);z-index:40;padding:14px 16px;border-radius:18px;background:rgba(14,22,42,.95);border:1px solid rgba(212,175,55,.5);box-shadow:0 12px 40px rgba(0,0,0,.55);font-size:14px;line-height:1.45;display:flex;gap:12px;align-items:center;animation:toastIn .45s cubic-bezier(.2,.8,.2,1) both;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.toast.out{animation:toastOut .35s ease both}
.toast .ti{font-size:24px;flex-shrink:0}
.choice{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:20px;background:var(--glass);border:1px solid rgba(201,206,214,.16);text-align:left;margin-bottom:10px;transition:border-color .2s,background .2s,box-shadow .2s}
.choice.on{border-color:var(--gold);background:rgba(212,175,55,.12);box-shadow:0 0 26px rgba(212,175,55,.22)}
.choice .ic{width:46px;height:46px;flex-shrink:0;border-radius:15px;background:rgba(212,175,55,.14);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px}
.choice .ic svg{width:22px;height:22px}
.choice b{display:block;font-size:15.5px}
.choice small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.38}
.choice .tick{margin-left:auto;width:24px;height:24px;flex-shrink:0;border-radius:50%;border:1.5px solid rgba(201,206,214,.3);display:flex;align-items:center;justify-content:center;color:#070D1C}
.choice.on .tick{background:var(--gold);border-color:var(--gold)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:4px;background:rgba(201,206,214,.25);transition:width .3s,background .3s}
.dots i.on{width:22px;background:var(--gold)}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.times button{height:46px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-family:var(--mono);font-weight:700;font-size:14px;color:var(--silver)}
.times button.on{background:var(--gold);color:#070D1C;border-color:var(--gold);box-shadow:0 0 18px rgba(212,175,55,.4)}
.field{display:block;width:100%;height:54px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-size:17px;padding:0 16px}
.field:focus{outline:none;border-color:var(--gold)}
.mission{position:relative;margin-top:14px;padding:16px;border-radius:24px;background:linear-gradient(140deg,rgba(110,200,150,.16),rgba(110,200,150,.03) 60%);border:1px solid rgba(110,200,150,.42)}
.mission.done{background:linear-gradient(140deg,rgba(110,200,150,.24),rgba(110,200,150,.06) 60%)}
.mission .why{font-size:13px;line-height:1.5;color:var(--ink2);margin-top:8px}
.mission .src2{display:block;font-size:11.5px;color:var(--muted);margin-top:6px}
.mbtns{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.mbtn{height:46px;border-radius:15px;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px}
.mbtn.go{background:var(--good);color:#06140C}
.mbtn.alt{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--silver);font-weight:600;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:1px;background:rgba(212,175,55,.18);color:var(--gold)}
.bodysvg{width:100%;max-width:400px;display:block;margin:0 auto;overflow:visible}
.bodysvg .zone{cursor:pointer}
.bodysvg .zone .g{opacity:var(--p);transition:opacity .6s}
.bodysvg .zone.rec .g{animation:zp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bodysvg .lbl{font-family:Inter,system-ui,sans-serif;font-size:10.5px;fill:#C9CED6}
.bodysvg .pct{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;fill:#D4AF37}
.bodysvg .scan{animation:scan 4s ease-in-out infinite}
.notifcard{margin-top:14px;padding:14px 16px;border-radius:20px;border:1px dashed rgba(212,175,55,.5);background:rgba(212,175,55,.06);display:flex;gap:12px;align-items:center;text-align:left;width:100%}
@keyframes toastIn{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-24px)}}
@keyframes zp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes scan{0%{transform:translateY(0);opacity:0}15%{opacity:.8}85%{opacity:.8}100%{transform:translateY(330px);opacity:0}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,40px) scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shimmer{from{transform:translateX(-150%) skewX(-20deg)}to{transform:translateX(700%) skewX(-20deg)}}
@keyframes pop{0%{transform:scale(.95)}55%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes float{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes floor{from{background-position:0 0}to{background-position:0 48px}}
@keyframes ripple{0%{transform:scale(.4);opacity:0}20%{opacity:.7}100%{transform:scale(2.4);opacity:0}}
@keyframes flash{0%{opacity:0;transform:scale(.3)}45%{opacity:.85}100%{opacity:0;transform:scale(1.8)}}
@keyframes reveal{0%{opacity:0;transform:scale(1.25);filter:blur(18px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes bandW{0%,30%{clip-path:polygon(-40% 0,-16% 0,-36% 100%,-60% 100%)}75%,100%{clip-path:polygon(140% 0,164% 0,144% 100%,120% 100%)}}
@keyframes bandN{0%,30%{clip-path:polygon(-30% 0,-24% 0,-44% 100%,-50% 100%)}75%,100%{clip-path:polygon(150% 0,156% 0,136% 100%,130% 100%)}}
@keyframes track{from{letter-spacing:12px;opacity:0}to{letter-spacing:3px;opacity:1}}
@keyframes ringIn{from{stroke-dashoffset:327}}
@keyframes flick{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.8}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,175,55,.55)}100%{box-shadow:0 0 0 18px rgba(212,175,55,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="orb a"></div><div class="orb b"></div>
  <div id="view"></div>
  <nav class="nav" id="nav"></nav>
  <div class="splash" id="splash">
    <div class="aurora"></div><div class="rays"></div><div class="floor"></div>
    <div class="ripple"></div><div class="ripple" style="animation-delay:1.6s;border-color:rgba(201,206,214,.5)"></div>
    <div class="flash"></div>
    <div class="logo">
      <img class="base" src="assets/logo-full.png" alt="MFC – Mathis Félicité Coaching">
      <img class="w" src="assets/logo-shine.png" alt="" aria-hidden="true">
      <img class="n" src="assets/logo-shine.png" alt="" aria-hidden="true">
    </div>
    <div class="tag">CULTIVE TON CORPS</div>
    <div class="sub">La science du sport,<br><span style="color:var(--gold2)">en 2 minutes par jour.</span></div>
  </div>
</div>

<script src="questions.js"></script>
<script src="questions-lot2.js"></script>
<script src="questions-lot3.js"></script>
<script src="questions-lot4.js"></script>
<script src="questions-lot5.js"></script>
<script src="questions-lot6.js"></script>
<script src="missions.js"></script>
<script>
(function(){
'use strict';
var Q = window.MFC_QUESTIONS, S = window.MFC_SOURCES, M = window.MFC_MODULES;
var QBY = {}; Q.forEach(function(q){ QBY[q.id]=q; });
var RANKS = [
  {n:'Novice',xp:0,r:'Le début de l’aventure'},
  {n:'Curieux',xp:500,r:'Badge Curieux sur ton profil'},
  {n:'Initié',xp:2500,r:'Thème Or débloqué'},
  {n:'Analyste',xp:5000,r:'Pose ta question, Mathis y répond en Reel'},
  {n:'Expert',xp:10000,r:'Certificat « Expert MFC Quiz »'},
  {n:'Légende',xp:25000,r:'Ton nom au Hall of Fame'}
];
var PER_QUIZ = 5, XP_RIGHT = 10, XP_PERFECT = 20;

/* ---------- sauvegarde locale ---------- */
var KEY='mfcq_v1';
function blank(){ return {xp:0,answered:0,correct:0,mastered:{},wrong:{},days:[],best:0,name:'',quizzes:0,lastDaily:'',onboarded:0,goal:'',level:'',freezes:0,frozen:[],mission:null,missionLog:{},missionsDone:0,notif:{on:0,time:'08:00',key:''}}; }
var st;
try{ st = JSON.parse(localStorage.getItem(KEY)) || blank(); }catch(e){ st = blank(); }
var b0=blank(); for(var k in b0){ if(st[k]===undefined) st[k]=b0[k]; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

function today(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dkey(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function activeSet(){ var set={}; st.days.concat(st.frozen||[]).forEach(function(d){set[d]=1;}); return set; }
function streak(){
  var set=activeSet();
  var n=0, d=new Date();
  if(!set[today()]){ d.setDate(d.getDate()-1); }

/* ---------- quiz ---------- */
function pickQuestions(kind,mod){
  var pool;
  if(kind==='mod') pool=Q.filter(function(q){return q.m===mod;});
  else if(kind==='rev') pool=Object.keys(st.wrong).map(function(id){return QBY[id];}).filter(Boolean);
  else {
    var un=Q.filter(function(q){return !st.mastered[q.id];}), per={};
    var out=wpick(un,PER_QUIZ,2,per);
    if(out.length<PER_QUIZ) out=out.concat(wpick(Q.filter(function(q){return st.mastered[q.id];}),PER_QUIZ-out.length,2,per));
    return shuffle(out);
  }
  // priorité aux questions pas encore maîtrisées
  var fresh=shuffle(pool.filter(function(q){return !st.mastered[q.id];})), old=shuffle(pool.filter(function(q){return st.mastered[q.id];}));
  return fresh.concat(old).slice(0,PER_QUIZ);
}
function startQuiz(kind,mod){

}

function pick(oi){

      h+='<button class="choice up d'+(i+1)+(ob.level===k?' on':'')+'" data-act="oblevel" data-id="'+k+'"><span class="ic">'+l.e+'</span><span><b>'+l.n+'</b><small>'+l.d+'</small></span><span class="tick">'+(ob.level===k?IC.check.replace('width="18" height="18"','width="14" height="14"'):'')+'</span></button>';
    });
  } else if(ob.step===3){
    h+='<div class="up" style="margin-top:14px"><div class="mono" style="color:var(--gold)">ÉTAPE 3 / 3</div><h1 class="h1" style="margin:6px 0 6px">Ton rappel du matin ☀️</h1><p style="color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 16px">Une notification par jour : « Tes 2 minutes de quiz pour démarrer la journée plus cultivé ». À quelle heure ?</p></div>';
    h+='<div class="times up d1">'; TIMES.forEach(function(t){ h+='<button data-act="obtime" data-id="'+t+'" class="'+(ob.time===t?'on':'')+'">'+fmtTime(t)+'</button>'; }); h+='</div>';
    h+='<div class="glass up d2" style="margin-top:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start"><div style="color:var(--gold);margin-top:2px">'+IC.bell+'</div><div style="font-size:13.5px;line-height:1.5;color:var(--ink2)">'+(ob.msg?esc(ob.msg):'Un seul rappel par jour, jamais plus. Tu pourras changer l’heure ou couper le rappel à tout moment dans ton Profil.')+'</div></div>';
  } else {
    var g=GOALS[ob.goal], gm=Object.keys(g.w).sort(function(a,b){return g.w[b]-g.w[a];}).slice(0,3).map(function(id){ return M.filter(function(m){return m.id===id;})[0].name; });
    h+='<div style="text-align:center;margin-top:4vh" class="up"><div style="font-size:64px;line-height:1;filter:drop-shadow(0 0 30px rgba(212,175,55,.5))">'+g.e+'</div><h1 class="h1" style="margin-top:16px;font-size:23px">Ton parcours est prêt'+(ob.name?', '+esc(ob.name):'')+' !</h1></div>';
    h+='<div class="goldcard up d1" style="margin-top:22px;padding:16px 18px"><div class="mono" style="color:var(--silver);font-size:10px">TON OBJECTIF</div><div style="font-family:var(--head);font-size:17px;font-weight:600;margin-top:3px">'+g.n+'</div><div style="font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.5">Priorité à : <b style="color:var(--gold2)">'+gm.join(' · ')+'</b>. Les autres thèmes restent dans le mélange, pour une culture complète.</div></div>';
    h+='<div class="up d2" style="display:grid;gap:10px;margin-top:12px">';
    [['⚡','Un défi de 5 questions par jour','Adapté à ton objectif, avec la source de chaque réponse'],['✅','Une mission concrète par jour','Une action simple, prouvée par la science, pour passer à la pratique'],['🧊','1 gel de série offert','Il protège ta série si tu rates un jour. Gagne-en un tous les 7 jours']].forEach(function(x){
      h+='<div class="glass" style="padding:13px 14px;display:flex;gap:12px;align-items:center"><span style="font-size:24px">'+x[0]+'</span><div><div style="font-size:14.5px;font-weight:700">'+x[1]+'</div><div style="font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4">'+x[2]+'</div></div></div>';
    });
    h+='</div>';
  }
  h+='<div style="flex:1;min-height:24px"></div>';
  if(ob.step===1||ob.step===2){ var ok=ob.step===1?!!ob.goal:!!ob.level; h+='<button class="btn gold" data-act="obnext" '+(ok?'':'disabled style="opacity:.4"')+'>Continuer '+IC.arrow+'</button>'; }
  if(ob.step===3){
    if(!isStandalone()) h+='<button class="btn gold" data-act="obnext">Continuer '+IC.arrow+'</button><div style="font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.45">Les rappels s’activent une fois l’app installée sur ton écran d’accueil.</div>';
    else h+='<button class="btn gold" data-act="obnotif">'+IC.bell.replace('width="22" height="22"','width="20" height="20"')+' Activer mon rappel à '+fmtTime(ob.time)+'</button><button class="btn ghost" data-act="obnext" style="margin-top:10px">Plus tard</button>';
  }
  if(ob.step===4) h+='<button class="btn gold up d3" data-act="obdone">Lancer mon premier défi '+IC.arrow+'</button>';
  h+='</div></div>';
  view.innerHTML=h;
  if(ob.step===0){ var f=document.getElementById('obf'); f.addEventListener('submit',function(e){ e.preventDefault(); ob.name=document.getElementById('obn').value.trim().slice(0,20); ob.step=1; drawOb(); }); }
}
function obAct(a,id){
  if(a==='obback'){ ob.step=Math.max(0,ob.step-1); ob.msg=''; drawOb(); }
  else if(a==='obgoal'){ ob.goal=id; drawOb(); setTimeout(function(){ if(ob&&ob.step===1){ ob.step=2; drawOb(); } },380); }
  else if(a==='oblevel'){ ob.level=id; drawOb(); setTimeout(function(){ if(ob&&ob.step===2){ ob.step=3; drawOb(); } },380); }
  else if(a==='obtime'){ ob.time=id; drawOb(); }
  else if(a==='obnext'){ if(ob.step===1&&!ob.goal||ob.step===2&&!ob.level) return; ob.step++; ob.msg=''; drawOb(); }
  else if(a==='obnotif'){ enableNotif(ob.time,function(r){ if(r==='ok'){ ob.step=4; drawOb(); } else { ob.msg=notifMsg(r); drawOb(); } }); }
  else if(a==='obdone'){
    var first=!st.onboarded;
    st.name=ob.name; st.goal=ob.goal; st.level=ob.level; st.notif.time=ob.time;
    if(first){ st.freezes=Math.max(st.freezes,1); }
    st.onboarded=1; st.mission=null; save(); ob=null; tab='home';
    startQuiz('daily');
  }
}

/* ---------- révisions ---------- */
function revisions(){
  var ids=Object.keys(st.wrong);
  var h='<div class="screen"><div class="wrap"><div class="up"><div class="mono" style="color:var(--muted)">TES ERREURS REVIENNENT ICI</div><h1 class="h1" style="margin-top:4px">Révisions</h1></div>';
  if(!ids.length){
    h+='<div class="glass up d1" style="margin-top:20px;padding:22px;text-align:center"><div style="font-family:var(--head);font-size:17px;font-weight:600">Rien à réviser</div><div style="font-size:14px;color:var(--muted);margin-top:6px;line-height:1.5">Chaque question ratée arrivera ici, jusqu’à ce que tu la réussisses.</div></div>';
  } else {
    h+='<div class="goldcard up d1" style="margin-top:18px;padding:18px"><div style="font-family:var(--head);font-size:30px;font-weight:700;color:var(--gold)">'+ids.length+'</div><div style="font-size:14px;color:var(--ink2);margin:2px 0 14px">question'+(ids.length>1?'s':'')+' à retravailler</div><button class="btn gold" data-act="rev">Réviser maintenant '+IC.arrow+'</button></div>';
    h+='<div class="glass list up d2" style="margin-top:14px;padding:4px 16px">';
    ids.slice(0,30).forEach(function(id){ var q=QBY[id]; if(q) h+='<div style="font-size:14px;line-height:1.4;color:var(--ink2)">'+esc(q.q)+'</div>'; });
    h+='</div>';
  }
  h+='</div></div>'; view.innerHTML=h;
}

/* ---------- rangs ---------- */
function ranks(){
  var rk=rankOf(st.xp);
  var h='<div class="screen"><div class="wrap"><div class="up row" style="justify-content:space-between"><div><div class="mono" style="color:var(--muted)">TA PROGRESSION</div><h1 class="h1" style="margin-top:4px">Rangs</h1></div><span class="chip" style="color:var(--gold)">'+fmt(st.xp)+' XP</span></div>';
  h+='<div class="glass up d1" style="margin-top:14px;padding:14px 16px;font-size:13px;color:var(--ink2);line-height:1.5">'+IC.bolt.replace('width="20" height="20"','width="16" height="16" style="vertical-align:-3px;color:var(--gold)"')+' 10 XP par bonne réponse · +20 XP pour un sans-faute</div>';
  h+='<div style="margin-top:14px">';
  RANKS.forEach(function(r,i){
    var done=st.xp>=r.xp, cur=i===rk.i;
    h+='<div class="'+(cur?'goldcard':'glass')+' up d'+Math.min(7,i+2)+'" style="display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:10px;border-radius:18px"><div style="width:42px;height:42px;flex-shrink:0;border-radius:13px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;'+(done?'background:var(--gold);color:#070D1C':'border:1px dashed #3A4A6B;color:var(--muted)')+'">'+(done?IC.check:(r.xp>=1000?(r.xp/1000)+'K':r.xp))+'</div><div style="flex:1"><div style="font-size:15px;font-weight:600'+(done?'':';color:var(--silver)')+'">'+r.n+(cur?' <span class="mono" style="color:var(--gold);font-size:10px">· TOI</span>':'')+'</div><div style="font-size:12px;color:var(--muted)">'+r.r+'</div></div><span class="mono" style="color:var(--muted);font-size:10px">'+fmt(r.xp)+' XP</span></div>';
  });
  h+='</div><div class="glass up d7" style="padding:14px 16px;border-style:dashed;display:flex;gap:12px;align-items:center"><div style="color:var(--silver)">'+IC.rank.replace('<svg','<svg width="22" height="22"')+'</div><div><div style="font-size:14px;font-weight:600">Ligues & défis partenaires · bientôt</div><div style="font-size:12px;color:var(--muted)">Affronte tes amis et gagne des lots de marques de sport</div></div></div>';
  h+='</div></div>'; view.innerHTML=h;
}

/* ---------- profil ---------- */
function profile(){
  var acc=st.answered?Math.round(st.correct/st.answered*100):0, mastered=Object.keys(st.mastered).length;
  var h='<div class="screen"><div class="wrap"><div class="up"><div class="mono" style="color:var(--muted)">MFC QUIZ</div><h1 class="h1" style="margin-top:4px">'+(st.name?esc(st.name):'Ton profil')+'</h1></div>';
  h+='<div class="up d1" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">';
  [['QUESTIONS',fmt(st.answered)],['RÉUSSITE',acc+' %'],['MAÎTRISÉES',mastered+'/'+Q.length],['MEILLEURE SÉRIE',st.best+' j'],['MISSIONS',fmt(st.missionsDone)],['QUIZ TERMINÉS',fmt(st.quizzes)]].forEach(function(x){ h+='<div class="glass" style="padding:14px"><div class="mono" style="color:var(--muted);font-size:10px">'+x[0]+'</div><div style="font-family:var(--head);font-size:20px;font-weight:600">'+x[1]+'</div></div>'; });
  h+='</div><div class="glass list up d2" style="margin-top:14px;padding:4px 16px">';
  h+='<button data-act="name" class="row" style="width:100%;justify-content:space-between;font-size:15px"><span>Mon prénom</span><span style="color:var(--muted)">'+(st.name?esc(st.name):'Ajouter')+' ›</span></button>';
  h+='<button data-act="goal" class="row" style="width:100%;justify-content:space-between;font-size:15px"><span>Mon objectif</span><span style="color:var(--muted);white-space:nowrap">'+(GOALS[st.goal]?GOALS[st.goal].e+' '+GOALS[st.goal].n:'Choisir')+' ›</span></button>';
  h+='<button data-act="notif" class="row" style="width:100%;justify-content:space-between;font-size:15px"><span>Rappel du matin</span><span style="white-space:nowrap;color:'+(st.notif.on?'var(--gold)':'var(--muted)')+'">'+(st.notif.on?'🔔 '+fmtTime(st.notif.time):'Désactivé')+' ›</span></button>';
  h+='<button data-act="freezeinfo" class="row" style="width:100%;justify-content:space-between;font-size:15px"><span>Gels de série</span><span style="color:var(--muted)">🧊 '+st.freezes+' / 2 ›</span></button>';
  h+='<button data-act="sources" class="row" style="width:100%;justify-content:space-between;font-size:15px"><span>Nos sources scientifiques</span><span style="color:var(--muted)">'+Object.keys(S).length+' ›</span></button>';
  h+='<button data-act="install" class="row" style="width:100%;justify-content:space-between;font-size:15px"><span>Ajouter à l’écran d’accueil</span><span style="color:var(--muted)">›</span></button>';
  h+='<a href="https://www.instagram.com/mathis.felicite/" target="_blank" rel="noopener" class="row" style="justify-content:space-between;font-size:15px;color:var(--ink)"><span>Suivre Mathis sur Instagram</span><span style="color:var(--muted)">›</span></a>';
  h+='<button data-act="reset" class="row" style="width:100%;justify-content:space-between;font-size:15px;color:var(--bad)"><span>Effacer ma progression</span></button>';
  h+='</div><div style="text-align:center;margin-top:22px"><img src="assets/logo-full.png" alt="MFC – Mathis Félicité Coaching" style="width:170px;opacity:.85"><div style="font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5">Contenu éducatif, ne remplace pas l’avis d’un médecin.<br>Ta progression est enregistrée sur ce téléphone.</div></div>';
  h+='</div></div>'; view.innerHTML=h;
}
function sheet(inner){
  var s=document.createElement('div'); s.className='sheet'; s.innerHTML='<div>'+inner+'</div>';
  s.addEventListener('click',function(e){ if(e.target===s||e.target.closest('[data-close]')) s.remove(); });
  document.getElementById('app').appendChild(s);
}
function sourcesSheet(){
  var h='<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 class="h1" style="font-size:18px">Nos sources</h2><button class="iconbtn" data-close aria-label="Fermer">'+IC.x+'</button></div><div style="font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:6px">Chaque question de MFC Quiz s’appuie sur l’une de ces publications : consensus d’experts, recommandations officielles, méta-analyses ou études de référence.</div><div class="list">';
  Object.keys(S).forEach(function(k){ var n=Q.filter(function(q){return q.s===k;}).length; h+='<div style="font-size:13px;line-height:1.45;color:var(--ink2)">'+esc(S[k].t)+'<br><a href="'+S[k].u+'" target="_blank" rel="noopener" style="font-size:12px">Ouvrir '+IC.ext+'</a> <span class="mono" style="color:var(--muted);font-size:10px">· '+n+' QUESTION'+(n>1?'S':'')+'</span></div>'; });
  h+='</div>'; sheet(h);
}
function nameSheet(){
  sheet('<div class="row" style="justify-content:space-between;margin-bottom:14px"><h2 class="h1" style="font-size:18px">Ton prénom</h2><button class="iconbtn" data-close aria-label="Fermer">'+IC.x+'</button></div><form id="nf"><label for="ni" class="mono" style="color:var(--muted)">COMMENT ON T’APPELLE ?</label><input id="ni" maxlength="20" value="'+esc(st.name)+'" autocomplete="given-name" style="display:block;width:100%;margin:8px 0 16px;height:52px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-size:17px;padding:0 16px"><button class="btn gold" type="submit">Enregistrer</button></form>');
  var f=document.getElementById('nf'), i=document.getElementById('ni'); setTimeout(function(){ i.focus(); },300);
  f.addEventListener('submit',function(e){ e.preventDefault(); st.name=i.value.trim().slice(0,20); save(); f.closest('.sheet').remove(); render(); });
}
function resetSheet(){
  sheet('<h2 class="h1" style="font-size:18px">Effacer ta progression ?</h2><p style="color:var(--muted);font-size:14px;line-height:1.5">Tes XP, ton rang, ta série et tes révisions seront remis à zéro. Impossible d’annuler.</p><div style="display:flex;flex-direction:column;gap:10px;margin-top:8px"><button class="btn" id="rz" style="background:rgba(240,140,90,.15);border:1px solid var(--bad);color:var(--bad)">Oui, tout effacer</button><button class="btn ghost" data-close>Annuler</button></div>');
  document.getElementById('rz').addEventListener('click',function(){ st=blank(); save(); document.querySelector('.sheet').remove(); tab='home'; startOnboarding(); });
}

function goalSheet(){
  var h='<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 class="h1" style="font-size:18px">Ton objectif</h2><button class="iconbtn" data-close aria-label="Fermer">'+IC.x+'</button></div>';
  Object.keys(GOALS).forEach(function(k){ var g=GOALS[k]; h+='<button class="choice'+(st.goal===k?' on':'')+'" data-goal="'+k+'"><span class="ic">'+g.e+'</span><span><b>'+g.n+'</b><small>'+g.d+'</small></span></button>'; });
  h+='<div class="mono" style="color:var(--muted);margin:16px 0 10px">TON NIVEAU</div>';
  Object.keys(LEVELS).forEach(function(k){ var l=LEVELS[k]; h+='<button class="choice'+(st.level===k?' on':'')+'" data-level="'+k+'"><span class="ic">'+l.e+'</span><span><b>'+l.n+'</b><small>'+l.d+'</small></span></button>'; });
  sheet(h);
  var s=document.querySelector('.sheet');
  s.addEventListener('click',function(e){
    var b=e.target.closest('[data-goal],[data-level]'); if(!b) return;
    if(b.dataset.goal){ st.goal=b.dataset.goal; } else { st.level=b.dataset.level; }
    if(st.mission && !st.mission.done) st.mission=null;
    save(); s.querySelectorAll('[data-goal]').forEach(function(x){ x.classList.toggle('on',x.dataset.goal===st.goal); }); s.querySelectorAll('[data-level]').forEach(function(x){ x.classList.toggle('on',x.dataset.level===st.level); });
    render(); toast(GOALS[st.goal]?GOALS[st.goal].e:'✅','Parcours mis à jour : tes prochains quiz et missions s’adaptent.',2600);
  });
}
function notifSheet(){
  var cur=st.notif.time||'08:00', msg='';
  function draw(){
    var h='<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 class="h1" style="font-size:18px">Rappel du matin</h2><button class="iconbtn" data-close aria-label="Fermer">'+IC.x+'</button></div>';
    h+='<p style="font-size:14px;color:var(--ink2);line-height:1.5;margin:0 0 14px">Une notification par jour pour tes 2 minutes de quiz. Choisis l’heure :</p><div class="times">';
    TIMES.forEach(function(t){ h+='<button data-time="'+t+'" class="'+(cur===t?'on':'')+'">'+fmtTime(t)+'</button>'; });
    h+='</div>';
    if(msg) h+='<div class="glass" style="margin-top:14px;padding:12px 14px;font-size:13px;line-height:1.5;color:var(--ink2)">'+esc(msg)+'</div>';
    h+='<div style="display:flex;flex-direction:column;gap:10px;margin-top:16px"><button class="btn gold" data-n="on">'+(st.notif.on?'Enregistrer : '+fmtTime(cur):'Activer mon rappel à '+fmtTime(cur))+'</button>'+(st.notif.on?'<button class="btn ghost" data-n="off">Couper le rappel</button>':'')+'</div>';
    return h;
  }
  sheet(draw());
  var s=document.querySelector('.sheet'), box=s.firstChild;
  s.addEventListener('click',function(e){
    var t=e.target.closest('[data-time]'), n=e.target.closest('[data-n]');
    if(t){ cur=t.dataset.time; box.innerHTML=draw(); }
    else if(n&&n.dataset.n==='off'){ disableNotif(); s.remove(); render(); toast('🔕','Rappel coupé.',2200); }
    else if(n){ enableNotif(cur,function(r){ if(r==='ok'){ s.remove(); render(); toast('🔔','Rappel programmé chaque jour à <b>'+fmtTime(cur)+'</b>.',3000); } else { msg=notifMsg(r); box.innerHTML=draw(); } }); }
  });
}
function freezeSheet(){
  var sk=streak();
  sheet('<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 class="h1" style="font-size:18px">Ta série '+IC.flame+' '+sk+' jour'+(sk>1?'s':'')+'</h2><button class="iconbtn" data-close aria-label="Fermer">'+IC.x+'</button></div><div class="list" style="font-size:14.5px;line-height:1.5;color:var(--ink2)"><div>Fais au moins un quiz ou ta mission du jour chaque jour pour faire grimper ta série. Record : <b style="color:var(--gold)">'+st.best+' jours</b>.</div><div><b>🧊 Gels de série : '+st.freezes+' / 2</b><br>Si tu rates une journée, un gel s’utilise tout seul et ta série est sauvée. Tu gagnes un gel tous les 7 jours de série (2 maximum en réserve).</div></div>');
}

function installSheet(){
  sheet('<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 class="h1" style="font-size:18px">Installer MFC Quiz</h2><button class="iconbtn" data-close aria-label="Fermer">'+IC.x+'</button></div><div class="list" style="font-size:15px;line-height:1.5;color:var(--ink2)"><div><b style="color:var(--gold)">1.</b> Ouvre cette page dans <b>Safari</b> sur ton iPhone.</div><div><b style="color:var(--gold)">2.</b> Appuie sur le bouton <b>Partager</b> (le carré avec une flèche vers le haut).</div><div><b style="color:var(--gold)">3.</b> Choisis <b>« Sur l’écran d’accueil »</b>, puis <b>Ajouter</b>.</div><div>L’icône MFC Quiz apparaît avec tes autres applis, s’ouvre en plein écran et marche même hors connexion.</div></div>');
}

/* ---------- démarrage ---------- */
var sp=document.getElementById('splash');
var seen=false; try{ seen=sessionStorage.getItem('mfcq_splash')==='1'; }catch(e){}
if(st.onboarded) { checkFreeze(); render(); refreshPush(); } else startOnboarding();
setTimeout(function(){ sp.classList.add('out'); setTimeout(function(){ sp.remove(); },700); try{ sessionStorage.setItem('mfcq_splash','1'); }catch(e){} }, seen?600:3600);
sp.addEventListener('click',function(){ sp.classList.add('out'); setTimeout(function(){ sp.remove(); },700); });
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
})();
</script>
