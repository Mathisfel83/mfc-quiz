<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MFC Quiz</title>
<meta name="description" content="La science du sport en 2 minutes par jour. Questions sourcées.">
<meta name="theme-color" content="#050A16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MFC Quiz">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#050A16; --bg2:#070D1C; --ink:#F2F4F7; --ink2:#DDE2EA; --muted:#9AA4B5; --silver:#C9CED6;
  --gold:#D4AF37; --gold2:#F3D98A; --goldd:#B8932A; --good:#6EC896; --bad:#F08C5A;
  --glass:rgba(255,255,255,0.045); --line:rgba(201,206,214,0.14);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --head:'Unbounded',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none}
body{overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:var(--gold2);text-decoration:none}
.app{position:fixed;inset:0;overflow:hidden;background-color:var(--bg2);
  background-image:linear-gradient(rgba(201,206,214,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(201,206,214,.045) 1px,transparent 1px);background-size:32px 32px}
.orb{position:absolute;border-radius:50%;filter:blur(24px);pointer-events:none}
.orb.a{top:-120px;right:-110px;width:330px;height:330px;background:radial-gradient(circle,rgba(212,175,55,.32),transparent 65%);animation:drift 13s ease-in-out infinite}
.orb.b{bottom:80px;left:-150px;width:350px;height:350px;background:radial-gradient(circle,rgba(60,110,255,.28),transparent 65%);animation:drift 17s ease-in-out infinite reverse}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 18px) 20px calc(var(--sab) + 110px)}
.screen.noNav{padding-bottom:calc(var(--sab) + 24px)}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:1.5px}
.h1{font-family:var(--head);font-weight:600;font-size:22px;line-height:1.25;margin:0}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.goldcard{background:linear-gradient(140deg,rgba(212,175,55,.2),rgba(212,175,55,.03) 65%);border:1px solid rgba(212,175,55,.5);border-radius:24px;box-shadow:0 10px 40px rgba(212,175,55,.12)}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:18px;font-weight:700;font-size:16px;overflow:hidden}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--goldd));color:#070D1C;box-shadow:0 10px 30px rgba(212,175,55,.35)}
.btn.gold::after{content:"";position:absolute;top:0;left:0;width:60px;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shimmer 2.8s ease-in-out infinite}
.btn.ghost{background:rgba(255,255,255,.04);border:1px solid rgba(201,206,214,.2);color:var(--silver);height:50px;font-weight:600;font-size:15px}
.btn:active{transform:scale(.98)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-family:var(--mono);font-size:13px;font-weight:700}
.bar{height:8px;border-radius:999px;background:rgba(201,206,214,.14);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--goldd),var(--gold),var(--gold2));box-shadow:0 0 12px rgba(212,175,55,.6);transform-origin:left;animation:grow 1.2s .2s cubic-bezier(.2,.8,.2,1) both}
.up{animation:up .55s ease both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}.d5{animation-delay:.3s}.d6{animation-delay:.36s}.d7{animation-delay:.42s}
/* nav */
.nav{position:absolute;left:16px;right:16px;bottom:calc(var(--sab) + 14px);padding:8px;border-radius:24px;background:rgba(14,22,42,.82);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:16px;font-size:11px;color:var(--muted)}
.nav button.on{background:rgba(212,175,55,.14);color:var(--gold);font-weight:600}
.nav svg{width:22px;height:22px}
.badge{position:absolute;margin-left:18px;margin-top:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#070D1C;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* modules */
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mod{text-align:left;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.mod .ic{width:40px;height:40px;border-radius:13px;background:rgba(212,175,55,.14);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.mod .ic svg{width:22px;height:22px}
.mod b{font-size:15px}
.mod small{font-size:12px;color:var(--muted);line-height:1.35}
.mod .bar{height:6px;margin-top:auto}
/* quiz */
.top{display:flex;align-items:center;gap:12px}
.iconbtn{width:44px;height:44px;flex-shrink:0;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--silver)}
.segs{flex:1;display:grid;gap:6px}
.seg{height:6px;border-radius:999px;background:rgba(201,206,214,.14)}
.seg.done{background:var(--gold);box-shadow:0 0 8px rgba(212,175,55,.6)}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:13px 16px;border-radius:18px;background:var(--glass);border:1px solid rgba(201,206,214,.16);font-size:15.5px;text-align:left;line-height:1.35;margin-bottom:10px}
.opt .l{width:34px;height:34px;flex-shrink:0;border-radius:11px;border:1px solid rgba(201,206,214,.3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--silver)}
.opt.good{background:rgba(110,200,150,.12);border-color:var(--good);box-shadow:0 0 28px rgba(110,200,150,.3);animation:pop .5s ease both}
.opt.good .l{background:var(--good);border-color:var(--good);color:#070D1C}
.opt.bad{background:rgba(240,140,90,.12);border-color:var(--bad);animation:shake .4s ease both}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:#070D1C}
.opt.dim{opacity:.5}
.fb{padding:15px 16px;margin-top:4px}
.fb .src{display:block;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.45}
.fb .src a{display:inline-flex;align-items:center;gap:4px;font-weight:600;margin-top:4px}
.xp{padding:4px 10px;border-radius:999px;background:rgba(212,175,55,.18);font-family:var(--mono);font-size:12px;font-weight:700;color:var(--gold);animation:float .8s .15s ease both}
/* splash */
.splash{position:absolute;inset:0;z-index:20;background:#050A16;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .6s ease}
.splash.out{opacity:0;pointer-events:none}
.aurora{position:absolute;left:50%;top:42%;width:720px;height:720px;margin:-360px 0 0 -360px;border-radius:50%;background:conic-gradient(from 0deg,rgba(212,175,55,.28),rgba(40,80,200,.3),rgba(201,206,214,.15),rgba(212,175,55,.28));filter:blur(70px);animation:spin 14s linear infinite}
.rays{position:absolute;left:50%;top:42%;width:580px;height:580px;margin:-290px 0 0 -290px;background:repeating-conic-gradient(from 0deg,rgba(243,217,138,.13) 0deg 2deg,transparent 2deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%);animation:spin 50s linear infinite,fadein 2s 1s ease both}
.floor{position:absolute;left:-100px;right:-100px;bottom:-40px;height:360px;background-image:linear-gradient(rgba(212,175,55,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.35) 1px,transparent 1px);background-size:48px 48px;transform:perspective(300px) rotateX(62deg);transform-origin:bottom;animation:floor 1.6s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%)}
.ripple{position:absolute;left:50%;top:42%;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;border:1px solid rgba(212,175,55,.6);animation:ripple 3.2s ease-out infinite}
.flash{position:absolute;left:50%;top:42%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;background:radial-gradient(circle,rgba(255,250,230,.9),rgba(243,217,138,.35) 30%,transparent 65%);animation:flash 1.4s 1.1s ease-out both}
.logo{position:relative;width:300px;height:126px;margin-top:-6vh;animation:reveal 1.6s .2s cubic-bezier(.2,.8,.2,1) both}
.logo img{position:absolute;inset:0;width:300px;height:126px}
.logo .base{filter:drop-shadow(0 8px 16px rgba(0,0,0,.65))}
.logo .w{opacity:.3;animation:bandW 3.6s 1.6s ease-in-out infinite both}
.logo .n{opacity:.9;animation:bandN 3.6s 1.6s ease-in-out infinite both}
.tag{position:relative;margin-top:28px;font-family:var(--mono);font-size:12px;color:var(--silver);animation:track 1.4s 1.2s cubic-bezier(.2,.8,.2,1) both}
.sub{position:relative;margin:14px 32px 0;text-align:center;font-family:var(--head);font-size:21px;font-weight:600;line-height:1.3;animation:up .8s 1.6s ease both}
/* result ring */
.ring{position:relative;width:150px;height:150px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring circle.v{animation:ringIn 1.4s .3s cubic-bezier(.2,.8,.2,1) both}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.confetti i{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
.sheet{position:absolute;inset:0;z-index:30;background:rgba(3,6,14,.7);display:flex;align-items:flex-end;animation:fadein .25s ease both}
.sheet>div{width:100%;max-height:85%;overflow-y:auto;padding:22px 20px calc(var(--sab) + 24px);border-radius:28px 28px 0 0;background:#0B1428;border-top:1px solid var(--line);animation:up .35s ease both}
.row{display:flex;align-items:center;gap:12px}
.list>*{padding:12px 0;border-bottom:1px solid rgba(201,206,214,.08)}
.list>*:last-child{border-bottom:0}
.wrap{max-width:520px;margin:0 auto}
.nav.n5{grid-template-columns:repeat(5,1fr)}
.nav.n5 button{font-size:10px}
.toast{position:absolute;left:16px;right:16px;top:calc(var(--sat) + 12px);z-index:40;padding:14px 16px;border-radius:18px;background:rgba(14,22,42,.95);border:1px solid rgba(212,175,55,.5);box-shadow:0 12px 40px rgba(0,0,0,.55);font-size:14px;line-height:1.45;display:flex;gap:12px;align-items:center;animation:toastIn .45s cubic-bezier(.2,.8,.2,1) both;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.toast.out{animation:toastOut .35s ease both}
.toast .ti{font-size:24px;flex-shrink:0}
.choice{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:20px;background:var(--glass);border:1px solid rgba(201,206,214,.16);text-align:left;margin-bottom:10px;transition:border-color .2s,background .2s,box-shadow .2s}
.choice.on{border-color:var(--gold);background:rgba(212,175,55,.12);box-shadow:0 0 26px rgba(212,175,55,.22)}
.choice .ic{width:46px;height:46px;flex-shrink:0;border-radius:15px;background:rgba(212,175,55,.14);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px}
.choice .ic svg{width:22px;height:22px}
.choice b{display:block;font-size:15.5px}
.choice small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.38}
.choice .tick{margin-left:auto;width:24px;height:24px;flex-shrink:0;border-radius:50%;border:1.5px solid rgba(201,206,214,.3);display:flex;align-items:center;justify-content:center;color:#070D1C}
.choice.on .tick{background:var(--gold);border-color:var(--gold)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:4px;background:rgba(201,206,214,.25);transition:width .3s,background .3s}
.dots i.on{width:22px;background:var(--gold)}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.times button{height:46px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-family:var(--mono);font-weight:700;font-size:14px;color:var(--silver)}
.times button.on{background:var(--gold);color:#070D1C;border-color:var(--gold);box-shadow:0 0 18px rgba(212,175,55,.4)}
.field{display:block;width:100%;height:54px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-size:17px;padding:0 16px}
.field:focus{outline:none;border-color:var(--gold)}
.mission{position:relative;margin-top:14px;padding:16px;border-radius:24px;background:linear-gradient(140deg,rgba(110,200,150,.16),rgba(110,200,150,.03) 60%);border:1px solid rgba(110,200,150,.42)}
.mission.done{background:linear-gradient(140deg,rgba(110,200,150,.24),rgba(110,200,150,.06) 60%)}
.mission .why{font-size:13px;line-height:1.5;color:var(--ink2);margin-top:8px}
.mission .src2{display:block;font-size:11.5px;color:var(--muted);margin-top:6px}
.mbtns{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.mbtn{height:46px;border-radius:15px;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px}
.mbtn.go{background:var(--good);color:#06140C}
.mbtn.alt{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--silver);font-weight:600;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:1px;background:rgba(212,175,55,.18);color:var(--gold)}
.bodysvg{width:100%;max-width:400px;display:block;margin:0 auto;overflow:visible}
.bodysvg .zone{cursor:pointer}
.bodysvg .zone .g{opacity:var(--p);transition:opacity .6s}
.bodysvg .zone.rec .g{animation:zp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bodysvg .lbl{font-family:Inter,system-ui,sans-serif;font-size:10.5px;fill:#C9CED6}
.bodysvg .pct{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;fill:#D4AF37}
.bodysvg .scan{animation:scan 4s ease-in-out infinite}
.notifcard{margin-top:14px;padding:14px 16px;border-radius:20px;border:1px dashed rgba(212,175,55,.5);background:rgba(212,175,55,.06);display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.avstage{position:relative;height:44vh;min-height:300px;max-height:460px;margin-top:12px;border-radius:26px;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,rgba(212,175,55,.2),rgba(60,110,255,.08) 45%,rgba(5,10,22,0) 72%),linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0));border:1px solid var(--line)}
.avstage canvas{position:absolute;inset:0}
.avload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;z-index:1;pointer-events:none}
.avhint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:1.2px;color:var(--silver);opacity:.75;pointer-events:none}
.avquick{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:2}
.avquick button{width:40px;height:40px;border-radius:13px;background:rgba(14,22,42,.7);border:1px solid var(--line);font-size:18px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.avtabs{display:flex;gap:8px;overflow-x:auto;margin:14px -20px 0;padding:0 20px 2px;scrollbar-width:none}
.avtabs::-webkit-scrollbar{display:none}
.avtabs button{flex-shrink:0;height:38px;padding:0 15px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--silver)}
.avtabs button.on{background:var(--gold);color:#070D1C;border-color:var(--gold)}
.seg2{display:flex;gap:6px;padding:4px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.seg2 button{flex:1;height:40px;border-radius:12px;font-size:14px;font-weight:600;color:var(--silver)}
.seg2 button.on{background:rgba(212,175,55,.18);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(212,175,55,.6)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.15);box-shadow:inset 0 -6px 10px rgba(0,0,0,.18)}
.swatches button.big{width:42px;height:42px}
.swatches button.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.35),inset 0 -6px 10px rgba(0,0,0,.18);transform:scale(1.08)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 button{height:44px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--silver)}
.grid2 button.on{border-color:var(--gold);color:var(--gold);background:rgba(212,175,55,.12)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
.rng::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--goldd),var(--gold2))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:#fff;border:3px solid var(--gold);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.rng::-moz-range-track{height:6px;border-radius:3px;background:var(--gold)}
.rng::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--gold)}
.avnote{margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.5}
.coll{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:12px 20px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}.coll::-webkit-scrollbar{display:none}.coll>*{scroll-snap-align:start}
.bdg{width:38px;height:46px;clip-path:polygon(12% 0,88% 0,100% 8%,100% 82%,50% 100%,0 82%,0 8%);display:flex;align-items:center;justify-content:center;font:700 14px/1 var(--head);padding-bottom:5px;box-sizing:border-box;flex-shrink:0}
.avcta{position:absolute;left:0;right:0;bottom:0;padding:12px 20px calc(var(--sab) + 14px);background:linear-gradient(180deg,rgba(7,13,28,0),rgba(7,13,28,.92) 35%);z-index:6}
.avcta .btn{max-width:520px;margin:0 auto}
.lpath{display:flex;flex-direction:column;gap:10px;margin:18px 0 14px;position:relative}
.lpath:before{content:"";position:absolute;left:33px;top:20px;bottom:20px;width:2px;background:linear-gradient(var(--gold),rgba(201,206,214,.15));opacity:.5}
.lnode{position:relative;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:20px;background:var(--glass);border:1px solid var(--line);text-align:left}
.lnode .lb{width:40px;height:40px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;background:#0E1830;border:1.5px solid rgba(201,206,214,.25);position:relative;z-index:1}
.lnode b{display:block;font-size:15px;margin-top:2px;line-height:1.3}
.lnode small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.lnode.done .lb{background:var(--gold);border-color:var(--gold);color:#070D1C}
.lnode.cur{border-color:rgba(212,175,55,.6);background:linear-gradient(140deg,rgba(212,175,55,.16),rgba(212,175,55,.02) 65%)}
.lnode.cur .lb{border-color:var(--gold);animation:pulse 1.8s ease-out infinite}
.lnode.lock{opacity:.5}
@keyframes toastIn{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}

<script>
(function(){
'use strict';
var Q = window.MFC_QUESTIONS, S = window.MFC_SOURCES, M = window.MFC_MODULES;
var QBY = {}; Q.forEach(function(q){ QBY[q.id]=q; });
var RANKS = [
  {n:'Bronze',xp:0,r:'🪪 Ta carte d’athlète MFC, avec tes 6 notes'},
  {n:'Argent',xp:423,r:'🪪 Carte Argent aux reflets néon'},
  {n:'Or',xp:2208,r:'🪪 Carte Or, notes et contours dorés'},
  {n:'Élite',xp:6688,r:'🪪 Carte Élite holographique · pose ta question, Mathis y répond en Reel'},
  {n:'Héros',xp:13568,r:'🪪 Carte Héros holographique + certificat « Expert MFC Quiz »'},
  {n:'Légende',xp:22848,r:'🪪 Carte Légende noire et or + ton nom au Hall of Fame'},
  {n:'Icône MFC',xp:31383,r:'🪪 Carte Icône MFC animée, la plus rare de l’appli'}
];
var PER_QUIZ = 5, XP_RIGHT = 10, XP_PERFECT = 20;

/* ---------- sauvegarde locale ---------- */
var KEY='mfcq_v1';
function blank(){ return {xp:0,answered:0,correct:0,mastered:{},wrong:{},days:[],best:0,name:'',quizzes:0,lastDaily:'',onboarded:0,prem:null,fq:null,pseudo:'',soc:null,faceH:'',duelSeen:{},roomSeen:{},pend:null,goal:'',level:'',freezes:0,frozen:[],mission:null,missionLog:{},missionsDone:0,lessons:{},tl:null,notif:{on:0,time:'08:00',key:''}}; }
var st;
try{ st = JSON.parse(localStorage.getItem(KEY)) || blank(); }catch(e){ st = blank(); }
var b0=blank(); for(var k in b0){ if(st[k]===undefined) st[k]=b0[k]; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

function today(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dkey(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function activeSet(){ var set={}; st.days.concat(st.frozen||[]).forEach(function(d){set[d]=1;}); return set; }
function streak(){
  var set=activeSet();
  var n=0, d=new Date();
  if(!set[today()]){ d.setDate(d.getDate()-1); }
  while(true){ var k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); if(set[k]){n++; d.setDate(d.getDate()-1);} else break; }
  return n;
}
function rankOf(xp){ var r=RANKS[0],i=0; RANKS.forEach(function(x,j){ if(xp>=x.xp){r=x;i=j;} }); return {r:r,i:i,next:RANKS[i+1]}; }
function modProgress(id){ var qs=Q.filter(function(q){return q.m===id;}); var m=qs.filter(function(q){return st.mastered[q.id];}).length; return {m:m,t:qs.length,p:qs.length?Math.round(m/qs.length*100):0}; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmt(n){ return n.toLocaleString('fr-FR'); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }


/* ---------- objectifs & personnalisation ---------- */
var GOALS = {
  perte:  {n:'Perdre du gras', e:'🔥', d:'Déficit calorique, alimentation, sommeil : ce qui marche vraiment', w:{nutrition:3,sommeil:2,sante:2,cardio:1.5,recup:1.3,muscle:1.5}, tags:['deficit','prot','sante']},
  muscle: {n:'Prendre du muscle', e:'💪', d:'Hypertrophie, protéines, récupération, programmation', w:{muscle:3,nutrition:2.5,recup:2,sommeil:1.6,sante:1,cardio:0.8}, tags:['hyper','prot']},
  endu:   {n:'Progresser en endurance', e:'🏃', d:'Course, vélo, trail : cœur, glucides, blessures', w:{cardio:3,nutrition:2,recup:2,sommeil:1.6,muscle:1,sante:1}, tags:['endu']},
  physio: {n:'Comprendre mon corps', e:'🧠', d:'Déjà sportif : ce qui se passe à l’intérieur quand tu t’entraînes', w:{muscle:2,cardio:2,recup:2,nutrition:1.6,sommeil:1.6,sante:1}, tags:['physio']},
  sante:  {n:'Être en forme et en santé', e:'🌿', d:'Bouger, bien dormir, bien manger, vivre longtemps', w:{sante:3,sommeil:2,cardio:2,nutrition:2,muscle:1.5,recup:1}, tags:['sante']}
};
var LEVELS = {
  debut:    {n:'Je débute', d:'Peu ou pas de sport pour l’instant', e:'🌱'},
  regulier: {n:'Je m’entraîne de temps en temps', d:'1 à 2 séances par semaine', e:'⚡'},
  confirme: {n:'Je m’entraîne régulièrement', d:'3 séances ou plus, je veux aller plus loin', e:'🏆'}
};
var TAGS = {
  physio:/VO2|lactate|noyau|fibre|glycog|hormone|mitochond|\bMETs?\b|oxyd|ATP|synthèse|mélatonine|cortisol|testost|insuline|ghréline|leptine|inflamm|carnosine|tendon|hypertroph|myonucl/i,
  deficit:/déficit|calori|perte de (poids|graisse)|perdre|maigr|régime|graisse|satiét|kcal|ultra-transf/i,
  prot:/protéine/i,
  hyper:/hypertroph|prise de muscle|masse musculaire|séries|répétition|charge|force/i,
  endu:/course|coureur|marathon|endurance|vélo|cardio|VO2|footing|fractionn|glucides/i,
  sante:/mortalit|risque|diabète|dépress|anxi|osseu|cancer|santé|sédentar|pas par jour|OMS/i
};
function weightOf(q){
  var g=GOALS[st.goal]; if(!g) return 1;
  var w=g.w[q.m]||1, txt=q.q+' '+q.e, bonus=0;
  g.tags.forEach(function(t){ if(TAGS[t].test(txt)) bonus+=1; });
  if(st.level==='confirme' && TAGS.physio.test(txt)) bonus+=0.6;
  if(st.level==='debut' && TAGS.sante.test(txt)) bonus+=0.4;
  return w*(1+Math.min(bonus,2)*1.2);
}
function wpick(pool,n,cap,per){
  var out=[], p=pool.slice(); per=per||{};
  while(out.length<n && p.length){
    var tot=0, ws=p.map(function(q){ var w=(per[q.m]>=cap)?0.001:weightOf(q); tot+=w; return w; });
    var r=Math.random()*tot, i=0; for(;i<p.length-1;i++){ r-=ws[i]; if(r<=0) break; }
    out.push(p[i]); per[p[i].m]=(per[p[i].m]||0)+1; p.splice(i,1);
  }
  return out;
}
function goalMods(){ var g=GOALS[st.goal]; if(!g) return []; return Object.keys(g.w).sort(function(a,b){return g.w[b]-g.w[a];}).slice(0,2); }

/* ---------- missions du jour ---------- */
var MI = window.MFC_MISSIONS||[], MIBY={}; MI.forEach(function(m){ MIBY[m.id]=m; });
function chooseMission(exclude){
  var recent={}, d=new Date();
  for(var i=0;i<6;i++){ var k=dkey(d); if(st.missionLog[k]) recent[st.missionLog[k]]=1; d.setDate(d.getDate()-1); }
  var pool=MI.filter(function(m){ return m.id!==exclude && !recent[m.id] && !(m.lv&&m.lv.indexOf(st.level)>=0); });
  if(!pool.length) pool=MI.filter(function(m){ return m.id!==exclude; });
  var tot=0, ws=pool.map(function(m){ var w=(m.g.indexOf(st.goal)>=0?(m.g[0]===st.goal?4:3):1); tot+=w; return w; });
  var r=Math.random()*tot, i=0; for(;i<pool.length-1;i++){ r-=ws[i]; if(r<=0) break; }
  return pool[i];
}
function todayMission(){
  if(!MI.length) return null;
  if(!st.mission || st.mission.d!==today() || !MIBY[st.mission.id]){
    var m=chooseMission(); st.mission={d:today(),id:m.id,done:0,swap:0}; st.missionLog[today()]=m.id;
    var ks=Object.keys(st.missionLog); if(ks.length>40) delete st.missionLog[ks[0]];
    save();
  }
  return MIBY[st.mission.id];
}
function missionHTML(cls){
  var m=todayMission(); if(!m) return '';
  var done=st.mission.done, src=S[m.s];
  var h='<div class="mission '+(done?'done ':'')+(cls||'')+'"><div class="row" style="justify-content:space-between"><span class="mono" style="color:var(--good);font-size:10px">MISSION DU JOUR · +15 XP</span>'+(done?'<span class="pill" style="background:rgba(110,200,150,.2);color:var(--good)">ACCOMPLIE ✓</span>':'')+'</div>';
  h+='<div style="font-size:16px;font-weight:700;line-height:1.35;margin-top:6px">'+esc(m.t)+'</div>';
  h+='<div class="why"><b style="color:var(--good)">Pourquoi ?</b> '+esc(m.w)+'</div>';
  if(src) h+='<a class="src2" href="'+src.u+'" target="_blank" rel="noopener">Source : '+esc((src.t.match(/^.*?\(\d{4}\)/)||[src.t.split('.')[0]])[0])+' '+IC.ext+'</a>';
  if(!done) h+='<div class="mbtns"><button class="mbtn go" data-act="mdone">'+IC.check+' C’est fait</button>'+(st.mission.swap?'':'<button class="mbtn alt" data-act="mswap">Autre mission</button>')+'</div>';
  h+='</div>';
  return h;
}

/* ---------- série & gels ---------- */
function recordDay(){
  var was=!!activeSet()[today()];
  if(st.days.indexOf(today())<0) st.days.push(today());
  if(st.days.length>400) st.days=st.days.slice(-400);
  var sk=streak(); if(sk>st.best) st.best=sk;
  if(!was && sk>0 && sk%7===0 && st.freezes<2){ st.freezes++; save(); return true; }
  save(); return false;
}
function checkFreeze(){
  var set=activeSet(); if(set[today()]) return;
  var d=new Date(); d.setDate(d.getDate()-1); var gap=[];
  while(!set[dkey(d)] && gap.length<4){ gap.push(dkey(d)); d.setDate(d.getDate()-1); }
  if(!gap.length || !set[dkey(d)]) return;
  if(gap.length<=st.freezes){
    st.freezes-=gap.length; st.frozen=(st.frozen||[]).concat(gap).slice(-60); save();
    setTimeout(function(){ toast('🧊','<b>'+(gap.length>1?'Tes gels de série ont':'Ton gel de série a')+' sauvé ta série !</b><br>'+streak()+' jours, toujours en vie. Fais ton quiz aujourd’hui pour la prolonger.'); },900);
  }
}
function toast(icon,html,ms){
  var old=document.querySelector('.toast'); if(old) old.remove();
  var t=document.createElement('div'); t.className='toast'; t.innerHTML='<span class="ti">'+icon+'</span><div>'+html+'</div>';
  t.addEventListener('click',function(){ t.remove(); });
  document.getElementById('app').appendChild(t);
  setTimeout(function(){ t.classList.add('out'); setTimeout(function(){ t.remove(); },400); }, ms||4200);
}

/* ---------- notifications ---------- */
var VAPID='BAs9xJaFQqybnKXO8GCvswUKS4pced8EZ_f2eLLfNRA2_r1_28W2plEntFd4TGQ5vkmpO9vkAkHzhd9Ji9hUfbY', PUSH_API='';
function isStandalone(){ return window.navigator.standalone===true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
function pushOK(){ return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window); }
function b64u(s){ var pad='='.repeat((4-s.length%4)%4), b=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/')), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
function fmtTime(t){ var p=t.split(':'); return (+p[0])+'h'+(p[1]==='00'?'':p[1]); }
function syncPush(sub){
  if(!PUSH_API || !sub) return;
  try{ fetch(PUSH_API+'/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sub:sub.toJSON?sub.toJSON():sub,time:st.notif.time,tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Paris',name:st.name||''})}).catch(function(){}); }catch(e){}
}
function subscribe(reg){
  return reg.pushManager.getSubscription().then(function(s){
    if(s && st.notif.key===VAPID) return s;
    return (s?s.unsubscribe():Promise.resolve()).then(function(){ return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)}); });
  });
}
function enableNotif(time,cb){
  if(NATIVE) return nativeEnable(time,cb);
  st.notif.time=time; save();
  if(!pushOK()){ cb(isStandalone()?'unsupported':'install'); return; }
  var ask=Notification.requestPermission(function(){});
  Promise.resolve(ask).then(function(p){
    p=p||Notification.permission;
    if(p!=='granted'){ st.notif.on=0; save(); cb('denied'); return; }
    st.notif.on=1; save();
    navigator.serviceWorker.ready.then(function(reg){
      reg.showNotification('Rappel activé ✅',{body:'Rendez-vous chaque jour à '+fmtTime(time)+' pour tes 2 minutes de quiz.',icon:'assets/icon-192.png',badge:'assets/icon-192.png',tag:'mfc-welcome'});
      return subscribe(reg).then(function(sub){ st.notif.key=VAPID; save(); syncPush(sub); });
    }).catch(function(){});
    cb('ok');
  });
}
function disableNotif(){
  st.notif.on=0; save(); if(NATIVE){ nativeSchedule(); return; }
  if(!pushOK()) return;
  navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription(); }).then(function(s){
    if(!s) return; if(PUSH_API) fetch(PUSH_API+'/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:s.endpoint})}).catch(function(){}); s.unsubscribe();
  }).catch(function(){});
}
function refreshPush(){
  if(NATIVE) return;
  if(!st.notif.on || !pushOK() || Notification.permission!=='granted') return;
  navigator.serviceWorker.ready.then(function(reg){ return subscribe(reg); }).then(function(sub){ st.notif.key=VAPID; save(); syncPush(sub); }).catch(function(){});
}
function notifMsg(r){
  if(r==='install') return 'Pour recevoir les rappels, installe d’abord MFC Quiz sur ton écran d’accueil (Safari → Partager → « Sur l’écran d’accueil »), puis active-les depuis l’app.';
  if(r==='denied') return 'Notifications refusées. Pour les activer : Réglages iPhone → Notifications → MFC Quiz.';
  if(r==='unsupported') return 'Ton téléphone ne prend pas en charge les notifications web. Mets à jour iOS (16.4 minimum).';
  return '';
}

/* partage d'une image : feuille de partage iOS (Instagram, Snapchat, WhatsApp, Photos…) ou téléchargement */
function shareImage(u,fname){
  var FS=plug('Filesystem'), SH=plug('Share');
  if(FS&&SH) return FS.writeFile({path:fname,data:u.split(',')[1],directory:'CACHE'}).then(function(r){ return SH.share({files:[r.uri]}); }).catch(function(){});
  return fetch(u).then(function(r){ return r.blob(); }).then(function(bl){
    var f=new File([bl],fname,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})) return navigator.share({files:[f]}).catch(function(){});
    var a=document.createElement('a'); a.href=u; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    toast('📥','Image enregistrée : ajoute-la à ta story depuis tes photos.',3200);
  });
}

/* ---------- Course au sommet (plateau en direct) ---------- */
var rm=null, TOP=20, LIM={choose:20000,answer:25000,reveal:6000};
var SPEC={4:{e:'🚡',n:'Télécabine',to:7},9:{e:'❄️',n:'Avalanche',to:6},12:{e:'🧗',n:'Raccourci',to:15},17:{e:'🕳️',n:'Crevasse',to:14}};

}

function roomJoinSheet(){

  f.addEventListener('submit',function(e){ e.preventDefault(); if(i.value.trim().length!==4) return; f.closest('.sheet').remove(); roomJoin(i.value); });
}
function roomOpen(j){
  roomClose(true);
  rm={code:j.code,v:j.version,s:j.state,me:j.me||(sbSess()||{}).uid,recv:Date.now(),busy:0};
  setNav(false); avUnmount(); drawRoom();
  rm.poll=setInterval(function(){ if(!rm||rm.busy) return; var c=rm.code; rpc('mfc_room_get',{p_code:c,p_version:rm.v}).then(function(x){ if(rm&&rm.code===c) roomApply(x); }).catch(function(){}); },1200);

}
function roomClose(silent){ if(!rm) return; clearInterval(rm.poll); clearInterval(rm.tick); rm=null; if(!silent){ tab='arena'; render(); } }
function roomApply(j){ if(!rm||!j||j.same||!j.state) return; if(j.version>rm.v){ rm.v=j.version; rm.s=j.state; rm.recv=Date.now(); drawRoom(); } }
function roomPush(ns){
  if(!rm||rm.busy) return; rm.busy=1; var c=rm.code;
  rpc('mfc_room_act',{p_code:c,p_version:rm.v,p_state:ns}).then(function(j){ if(rm&&rm.code===c){ rm.busy=0; roomApply(j); } },function(e){ if(rm){ rm.busy=0; } sxErr(e); });
}
function cl(o){ return JSON.parse(JSON.stringify(o)); }
function active(s){ return s.players.filter(function(p){ return !p.gone; }); }
function nextTurn(s){
  s.phase='choose'; s.diff=null; s.qid=null; s.pick=null; s.ok=null; s.ev=null; s.tout=0;
  if(active(s).length<2){ s.status='end'; s.winner=(active(s)[0]||{}).id||null; return s; }
  var n=s.players.length, t=s.turn;
  for(var k=1;k<=n;k++){ var c=(t+k)%n; if(!s.players[c].gone){ if(c<=t) s.round=(s.round||1)+1; s.turn=c; break; } }
  return s;
}
function advance(s){ s=cl(s); if(s.winner){ s.status='end'; return s; } return nextTurn(s); }
function pickQ(s,d){
  var pool=Q.filter(function(q){ return DIFF[q.id]===d&&s.used.indexOf(q.id)<0; });
  if(!pool.length){ s.used=[]; pool=Q.filter(function(q){ return DIFF[q.id]===d; }); }
  return pool[Math.floor(Math.random()*pool.length)].id;
}
function resolve(s,oi){
  s=cl(s); var p=s.players[s.turn], q=s.qid?QBY[s.qid]:null;
  s.pick=oi; s.ok=!!(q&&oi===q.a); s.from=p.pos; s.ev=null; s.tout=oi<0?1:0;
  if(s.ok){ var to=Math.min(TOP,p.pos+DN[s.diff][1]); if(SPEC[to]){ s.ev={c:to,to:SPEC[to].to}; to=SPEC[to].to; } p.pos=to; p.miss=0; }
  else if(s.tout){ p.miss=(p.miss||0)+1; if(p.miss>=2) p.gone=true; }
  s.to=p.pos; s.phase='reveal'; if(p.pos>=TOP) s.winner=p.id;
  return s;
}
function roomTick(){
  if(!rm) return;
  var s=rm.s, el=Date.now()-rm.recv, lim=LIM[s.phase]||0, b=document.getElementById('rmbar');
  if(b) b.style.width=Math.max(0,100-el/lim*100)+'%';
  if(s.status!=='play'||rm.busy) return;
  var c=s.players[s.turn], mine=c&&c.id===rm.me;
  if(s.phase==='reveal'){ if((mine&&el>lim)||el>lim+5000) roomPush(advance(s)); }
  else if((mine&&el>lim)||el>lim+5000) roomPush(resolve(s,-1));
}
function roomAct(a,v){
  if(!rm) return; var s=rm.s, c=s.players[s.turn], mine=c&&c.id===rm.me;
  if(a==='start'){ if(s.players.length<2) return; var ns=cl(s); ns.status='play'; ns.players=shuffle(ns.players).map(function(p){ p.pos=0; p.miss=0; p.gone=false; return p; }); ns.turn=0; ns.round=1; ns.used=[]; ns.winner=null; nextTurn(ns); ns.turn=0; ns.round=1; roomPush(ns); }
  else if(a==='diff'&&mine&&s.phase==='choose'){ var n2=cl(s), d=+v; n2.diff=d; n2.qid=pickQ(n2,d); n2.used.push(n2.qid); n2.order=shuffle([0,1,2]); n2.phase='answer'; roomPush(n2); }
  else if(a==='ans'&&mine&&s.phase==='answer'){ var r=resolve(s,+v); buzz(r.ok); if(r.ok) gainXP(DN[r.diff][2]); st.answered++; if(r.ok) st.correct++; save(); roomPush(r); }
}
function roomQuit(){
  if(!rm) return;
  var s=rm.s, inGame=s.status!=='end';
  if(inGame&&!confirm(s.status==='lobby'?'Quitter le salon ?':'Quitter la partie ? Tu seras retiré de la course.')) return;
  if(s.status==='lobby'){ var ns=cl(s); ns.players=ns.players.filter(function(p){ return p.id!==rm.me; }); roomPush(ns); }
  else if(s.status==='play'){ var n2=cl(s), me=n2.players.filter(function(p){ return p.id===rm.me; })[0]; if(me){ me.gone=true; if(n2.players[n2.turn].id===rm.me) n2=advance(n2); else if(active(n2).length<2){ n2.status='end'; n2.winner=(active(n2)[0]||{}).id; } roomPush(n2); } }
  setTimeout(function(){ roomClose(); },300);
}
